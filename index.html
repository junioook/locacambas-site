/* =====================================================================
   Login pelo Supabase Auth
   Quando CONFIG (arquivo config.js) tem URL e chave, o login usa o Supabase.
   Sem CONFIG, o protótipo funciona no modo demonstração (usuários locais).
   ===================================================================== */
const SB_ATIVO = typeof CONFIG !== 'undefined' && !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
let SB = null;
if (SB_ATIVO && window.supabase) {
  SB = window.supabase.createClient(CONFIG.SUPABASE_URL.replace(/\/rest\/v1\/?$/, '').replace(/\/$/, ''), CONFIG.SUPABASE_KEY);
}
const emailDoLogin = login => {
  const l = login.trim().toLowerCase();
  return l.includes('@') ? l : `${l}@${CONFIG.DOMINIO_EMAIL || 'locacambas.com.br'}`;
};
const MSG_ERRO_SB = {
  'Invalid login credentials': 'Usuário ou senha inválidos.',
  'Email not confirmed': 'Este usuário ainda não foi confirmado no Supabase (marque "Auto Confirm User" ao criar).',
};

async function loginSupabase(login, senha) {
  if (!SB) return renderLogin('Sem conexão com o servidor. Verifique a internet e tente de novo.', login);
  if (!login.trim() || !senha) return renderLogin('Informe usuário e senha.', login);
  const btn = document.querySelector('form[data-form=login] button');
  if (btn) { btn.disabled = true; btn.textContent = 'Entrando…'; }
  try {
    const { data, error } = await SB.auth.signInWithPassword({ email: emailDoLogin(login), password: senha });
    if (error) return renderLogin(MSG_ERRO_SB[error.message] || `Não foi possível entrar: ${error.message}`, login);
    await entrarComSessao(data.user, login);
  } catch (e) {
    renderLogin('Sem conexão com o servidor. Verifique a internet e tente de novo.', login);
  }
}

// Baixa os dados do banco (ou usa a cópia do aparelho, se estiver sem internet) e abre a tela do perfil.
async function entrarComSessao(user, login = '') {
  const temCopia = lerLocal(user.id);
  if (!temCopia) { S = vazio(); SNAP = {}; SERVIDOR = new Set(); FILA = []; }
  try { await puxar(); SEM_REDE = false; }
  catch (e) {
    SEM_REDE = ehErroDeRede(e);
    if (!(SEM_REDE && temCopia)) {
      await sairSupabase();
      return renderLogin(SEM_REDE ? 'Sem conexão com o servidor. Verifique a internet e tente de novo.' : `Erro ao carregar os dados: ${e.message}`, login);
    }
  }
  const u = S.perfis.find(p => p.id === user.id);
  if (!u) { await sairSupabase(); return renderLogin('Este usuário não tem perfil cadastrado na tabela "perfis".', login); }
  if (!u.ativo) { await sairSupabase(); return renderLogin('Este usuário está desativado. Procure o administrador.', login); }
  entrar(u);
  iniciarTempoReal();
  if (u.papel !== 'motorista') {
    const r = gerarMensalidades(mesAtual(), u.id, true);
    if (r.geradas) { auditar('mensalidades.gerar', `Rotina automática: ${r.geradas} mensalidade(s) de ${fmtComp(mesAtual())}`, u.id); salvar(); render(); }
  }
  enviarFila();
}

function vincularUsuarioLocal(user, perfil) {
  const prefixo = (user.email || '').split('@')[0].toLowerCase();
  let u = S.perfis.find(x => x.auth_id === user.id) || S.perfis.find(x => x.login.toLowerCase() === prefixo);
  if (!u) { u = { id: user.id, login: prefixo, senha: '', telefone: '', ativo: true }; S.perfis.push(u); }
  Object.assign(u, { auth_id: user.id, email: user.email, nome: perfil.nome, papel: perfil.papel, ativo: true });
  salvar();
  return u;
}

async function sairSupabase() {
  pararTempoReal(); FILA = []; SNAP = {}; SERVIDOR = new Set(); S = vazio();
  if (SB) { try { await SB.auth.signOut(); } catch (e) { } }
}

async function sessaoSupabase() {
  if (!SB) return false;
  try {
    const { data } = await SB.auth.getSession();
    if (!data.session) return false;
    await entrarComSessao(data.session.user);
    return true;
  } catch (e) { return false; }
}

// SQL para criar o perfil de um novo usuário (depois de criá-lo em Authentication → Users).
function sqlNovoPerfil(nome, login, papel) {
  const n = (nome || 'Nome').replace(/'/g, "''"), e = emailDoLogin(login || 'usuario').replace(/'/g, "''");
  return `insert into public.perfis (id, nome, papel)\nselect id, '${n}', '${papel || 'motorista'}' from auth.users where email = '${e}';`;
}

/* =====================================================================
   Sincronização com o Supabase
   - Ao entrar: baixa os dados do banco (respeitando as regras de cada perfil).
   - A cada alteração (salvar): compara com o que já foi enviado e coloca as linhas
     alteradas numa fila; a fila é enviada ao banco (e guardada no aparelho se faltar internet).
   - Fotos vão para o Storage (pasta "fotos").
   - Tempo real: quando outro aparelho grava, este baixa os dados de novo e atualiza a tela.
   ===================================================================== */
const DEFS = [
  { t: 'perfis', tabela: 'perfis', pk: 'id', soAtualiza: true, cols: ['id', 'nome', 'telefone', 'ativo'] },
  { t: 'clientes', tabela: 'clientes', pk: 'id', cols: ['id', 'tipo', 'nome', 'doc', 'telefone', 'whatsapp', 'email', 'endereco', 'bairro', 'cidade', 'cep', 'lat', 'lng', 'obs', 'ativo', 'criado_em'] },
  { t: 'cacambas', tabela: 'cacambas', pk: 'id', cols: ['id', 'numero', 'capacidade', 'status', 'obs'] },
  { t: 'locacoes', tabela: 'locacoes', pk: 'id', cols: ['id', 'cliente_id', 'cacamba_id', 'capacidade', 'endereco', 'lat', 'lng', 'data_entrega', 'prev_retirada', 'data_retirada', 'mensal', 'serie', 'status'] },
  { t: 'series', tabela: 'series_mensais', pk: 'serie', cols: ['serie', 'cliente_id', 'valor_mensal', 'dia_cobranca'] },
  { t: 'os', tabela: 'ordens_servico', pk: 'id', cols: ['id', 'numero', 'criada_em', 'cliente_id', 'tipo', 'modalidade', 'locacao_id', 'locacao_nova_id', 'capacidade', 'cacamba_entregue_id', 'cacamba_retirada_id', 'endereco', 'lat', 'lng', 'foto_local', 'motorista_id', 'agendada_para', 'status', 'iniciada_em', 'concluida_em', 'gps', 'obs', 'obs_motorista', 'fotos', 'excecao', 'cancelamento'], horas: ['criada_em', 'agendada_para', 'iniciada_em', 'concluida_em'] },
  { t: 'movimentacoes', tabela: 'movimentacoes', pk: 'id', cols: ['id', 'cacamba_id', 'os_id', 'tipo', 'cliente_id', 'serie', 'endereco', 'lat', 'lng', 'em'], horas: ['em'] },
  { t: 'cobrancas', tabela: 'cobrancas', pk: 'id', cols: ['id', 'numero', 'cliente_id', 'os_id', 'locacao_id', 'serie', 'os_origem', 'competencia', 'descricao', 'valor', 'emissao', 'vencimento', 'forma_prevista', 'cancelada', 'obs'], numeros: ['valor'] },
  { t: 'pagamentos', tabela: 'pagamentos', pk: 'id', cols: ['id', 'cobranca_id', 'valor', 'data', 'forma', 'por', 'obs'], numeros: ['valor'] },
  { t: 'auditoria', tabela: 'auditoria', pk: 'id', cols: ['id', 'em', 'usuario_id', 'acao', 'descricao'], horas: ['em'] },
];
const DEF = Object.fromEntries(DEFS.map(d => [d.t, d]));

let SNAP = {};             // "tabela:id" → linha já enviada (ou na fila), em texto
let SERVIDOR = new Set();  // "tabela:id" que já existem no banco
let FILA = [];             // alterações ainda não enviadas: [{ id, linhas: [{t, id, row}], fotos: [{path, dataUrl}] }]
let ENVIANDO = false, PUXAR_DEPOIS = false, SEM_REDE = false, ULTIMO_ERRO = '';
const FOTO_CACHE = {};     // caminho → imagem local (antes/depois do envio)
const FOTO_URL = {};       // caminho → link temporário do Storage
let FOTOS_NOVAS = [];
let CANAL = null, TMR_PUXAR = null, PENDENTE_RENDER = false;

// ---------------------------------------------------------------- conversão objeto ⇄ linha
function linhasDe(t) {
  if (t === 'series') {
    const m = {};
    for (const l of S.locacoes) if (l.mensal && l.serie && l.valor_mensal != null && !m[l.serie] && (l.id === l.serie || !S.locacoes.some(x => x.id === l.serie)))
      m[l.serie] = { serie: l.serie, cliente_id: l.cliente_id, valor_mensal: l.valor_mensal, dia_cobranca: l.dia_cobranca };
    return Object.values(m);
  }
  return S[t] || [];
}
function paraLinha(d, o) {
  const r = {};
  for (const c of d.cols) {
    let v = o[c];
    if (c === 'fotos') v = (v || []).map(f => ({ id: f.id, tipo: f.tipo, kb: f.kb || null, em: f.em || null, path: f.path || null }));
    r[c] = v === undefined ? null : v;
  }
  return r;
}
function deLinha(d, r) {
  const o = { ...r };
  for (const c of d.horas || []) if (o[c]) o[c] = String(o[c]).replace(' ', 'T').slice(0, 16);
  for (const c of d.numeros || []) if (o[c] != null) o[c] = Number(o[c]);
  for (const c of ['data_entrega', 'prev_retirada', 'data_retirada', 'emissao', 'vencimento', 'data', 'criado_em']) if (o[c]) o[c] = String(o[c]).slice(0, 10);
  if (d.t === 'os') { o.fotos = o.fotos || []; o.obs = o.obs || ''; o.obs_motorista = o.obs_motorista || ''; }
  return o;
}
const chave = (t, id) => `${t}:${id}`;

// ---------------------------------------------------------------- cópia local (para abrir sem internet)
const chaveCache = () => `locacambas-sb-${UI.user ? UI.user.id : 'x'}`;
function guardarLocal() {
  if (!UI.user) return;
  try { localStorage.setItem(chaveCache(), JSON.stringify({ S, SNAP, SERVIDOR: [...SERVIDOR], FILA })); semArmazenamento = false; }
  catch (e) { semArmazenamento = true; }
}
function lerLocal(uidUsuario) {
  try {
    const d = JSON.parse(localStorage.getItem(`locacambas-sb-${uidUsuario}`) || 'null');
    if (!d) return false;
    S = d.S; SNAP = d.SNAP || {}; SERVIDOR = new Set(d.SERVIDOR || []); FILA = d.FILA || [];
    for (const tx of FILA) for (const f of tx.fotos || []) FOTO_CACHE[f.path] = f.dataUrl;
    return true;
  } catch (e) { return false; }
}
function vazio() { return { v: 1, seq: {}, perfis: [], clientes: [], cacambas: [], contratos: [], locacoes: [], os: [], movimentacoes: [], cobrancas: [], pagamentos: [], auditoria: [] }; }

// ---------------------------------------------------------------- salvar = enfileirar o que mudou
function extrairFotos() {
  for (const o of S.os) {
    if (o.foto_local && o.foto_local.startsWith('data:')) {
      const path = `${o.id}/local-${uid()}.jpg`;
      FOTO_CACHE[path] = o.foto_local; FOTOS_NOVAS.push({ path, dataUrl: o.foto_local }); o.foto_local = path;
    }
    for (const f of o.fotos || []) if (f.src && f.src.startsWith('data:')) {
      const path = `${o.id}/${f.id}.jpg`;
      FOTO_CACHE[path] = f.src; FOTOS_NOVAS.push({ path, dataUrl: f.src }); f.path = path; delete f.src;
    }
  }
}
function salvarNoBanco() {
  extrairFotos();
  const tx = { id: uid(), linhas: [], fotos: FOTOS_NOVAS.splice(0) };
  for (const d of DEFS) {
    if (d.t === 'perfis' && !ehAdmin()) continue;
    if (d.t === 'series' && UI.user && UI.user.papel === 'motorista') continue;
    for (const o of linhasDe(d.t)) {
      const row = paraLinha(d, o), k = chave(d.t, row[d.pk]), txt = JSON.stringify(row);
      if (SNAP[k] !== txt) { tx.linhas.push({ t: d.t, id: row[d.pk], row }); SNAP[k] = txt; }
    }
  }
  if (tx.linhas.length || tx.fotos.length) FILA.push(tx);
  guardarLocal();
  enviarFila();
}

// ---------------------------------------------------------------- envio da fila
const ehErroDeRede = e => !navigator.onLine || /failed to fetch|networkerror|network request failed|load failed|fetch/i.test(String((e && (e.message || e)) || '')) && !(e && e.code);
const erroBanco = (e) => { const x = new Error(e.message || String(e)); x.code = e.code; x.banco = true; return x; };
function dataUrlParaBlob(u) {
  const [cab, b64] = u.split(','), tipo = (cab.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: tipo });
}
async function gravarLinha(d, l) {
  const k = chave(d.t, l.id);
  const atualizar = async () => {
    const { data, error } = await SB.from(d.tabela).update(l.row).eq(d.pk, l.id).select(d.pk);
    if (error) throw erroBanco(error);
    return data && data.length;
  };
  if (d.soAtualiza || SERVIDOR.has(k)) {
    if (await atualizar()) { SERVIDOR.add(k); return; }
    if (d.soAtualiza) throw erroBanco({ message: 'sem permissão para alterar este registro' });
  }
  const { error } = await SB.from(d.tabela).insert(l.row);
  if (error) {
    if (error.code === '23505' && /pkey/.test(error.message || '')) { if (!(await atualizar())) throw erroBanco({ message: 'sem permissão para alterar este registro' }); }
    else throw erroBanco(error);
  }
  SERVIDOR.add(k);
}
async function verificarConflitos(tx) {
  if (!UI.user || UI.user.papel !== 'motorista') return null;
  const ids = tx.linhas.filter(l => l.t === 'os' && SERVIDOR.has(chave('os', l.id))).map(l => l.id);
  if (!ids.length) return null;
  const { data, error } = await SB.from('ordens_servico').select('id, numero, status, motorista_id, cancelamento').in('id', ids);
  if (error) throw erroBanco(error);
  for (const id of ids) {
    const srv = (data || []).find(x => x.id === id), loc = ordem(id), num = (srv || loc || {}).numero || 'O.S.';
    if (!srv || srv.motorista_id !== UI.user.id) return `${num}: foi passada para outro motorista pelo escritório enquanto você estava sem sinal. O que você registrou não foi enviado; avise o escritório.`;
    if (srv.status === 'cancelada') return `${num}: foi cancelada pelo escritório enquanto você estava sem sinal${srv.cancelamento && srv.cancelamento.motivo ? ` (${srv.cancelamento.motivo})` : ''}. O que você registrou não foi enviado; avise o escritório.`;
  }
  return null;
}
async function enviarFila() {
  if (!SB || !UI.user || ENVIANDO) return;
  if (!navigator.onLine) { SEM_REDE = true; atualizarStatusSync(); return; }
  ENVIANDO = true; atualizarStatusSync();
  let precisaPuxar = false;
  try {
    while (FILA.length) {
      const tx = FILA[0];
      for (const f of [...(tx.fotos || [])]) {
        const { error } = await SB.storage.from('fotos').upload(f.path, dataUrlParaBlob(f.dataUrl), { upsert: true, contentType: 'image/jpeg' });
        if (error) throw (ehErroDeRede(error) ? error : erroBanco(error));
        tx.fotos.shift(); guardarLocal();
      }
      const conflito = await verificarConflitos(tx);
      if (conflito) { FILA.shift(); avisarMotorista('erro', conflito); precisaPuxar = true; continue; }
      try {
        for (const d of DEFS) for (const l of tx.linhas.filter(x => x.t === d.t)) await gravarLinha(d, l);
      } catch (e) {
        if (!e.banco) throw e;
        FILA.shift(); precisaPuxar = true;
        const msg = e.code === '23505' ? 'outro usuário gravou o mesmo registro ao mesmo tempo; os dados foram recarregados, confira e tente de novo' : e.message;
        toast(`Não foi possível salvar no banco: ${msg}`, 'erro'); avisarMotorista('erro', `Não foi possível enviar: ${msg}`);
        continue;
      }
      FILA.shift(); guardarLocal();
    }
    SEM_REDE = false; ULTIMO_ERRO = '';
  } catch (e) {
    SEM_REDE = true; ULTIMO_ERRO = e.message || String(e);
  } finally {
    ENVIANDO = false; guardarLocal(); atualizarStatusSync();
  }
  if (precisaPuxar || PUXAR_DEPOIS) { PUXAR_DEPOIS = false; puxarERender(); }
}
function avisarMotorista(tipo, msg) { if (DRV && UI.user && UI.user.papel === 'motorista' && !DRV.avisos.some(x => x.msg === msg)) { DRV.avisos.push({ tipo, msg }); renderSeguro(); } }

// ---------------------------------------------------------------- baixar do banco
async function puxar() {
  const consultas = DEFS.map(d => {
    if (d.t === 'perfis') return SB.from('perfis').select('id, nome, papel, ativo, email, telefone');
    if (d.t === 'auditoria') return SB.from('auditoria').select('*').order('em', { ascending: false }).limit(500);
    return SB.from(d.tabela).select('*');
  });
  const res = await Promise.all(consultas);
  const falha = res.find(r => r.error);
  if (falha) throw (ehErroDeRede(falha.error) ? falha.error : erroBanco(falha.error));
  const novo = vazio(), snap = {}, srv = new Set(), dados = {};
  DEFS.forEach((d, i) => { dados[d.t] = res[i].data || []; });
  for (const d of DEFS) for (const r of dados[d.t]) {
    const o = deLinha(d, r);
    if (d.t === 'perfis') Object.assign(o, { login: (o.email || '').split('@')[0] || o.nome.toLowerCase(), telefone: o.telefone || '' });
    if (d.t !== 'series') novo[d.t].push(o);
    const k = chave(d.t, r[d.pk]);
    srv.add(k);
    if (d.t !== 'perfis') snap[k] = JSON.stringify(paraLinha(d, o));
  }
  const series = Object.fromEntries(dados.series.map(r => [r.serie, deLinha(DEF.series, r)]));
  for (const l of novo.locacoes) if (l.mensal && series[l.serie]) { l.valor_mensal = series[l.serie].valor_mensal; l.dia_cobranca = series[l.serie].dia_cobranca; }
  for (const p of novo.perfis) snap[chave('perfis', p.id)] = JSON.stringify(paraLinha(DEF.perfis, p));
  // o que ainda está na fila deste aparelho continua valendo por cima do que veio do banco
  for (const tx of FILA) for (const l of tx.linhas) {
    const d = DEF[l.t], o = deLinha(d, l.row);
    snap[chave(l.t, l.id)] = JSON.stringify(l.row);
    if (l.t === 'series') { for (const loc of novo.locacoes) if (loc.serie === l.id) { loc.valor_mensal = o.valor_mensal; loc.dia_cobranca = o.dia_cobranca; } continue; }
    if (l.t === 'perfis') { const p = novo.perfis.find(x => x.id === l.id); if (p) Object.assign(p, o); continue; }
    const lista = novo[l.t], i = lista.findIndex(x => x.id === l.id);
    if (l.t === 'locacoes' && i >= 0) { o.valor_mensal = lista[i].valor_mensal; o.dia_cobranca = lista[i].dia_cobranca; }
    if (i >= 0) lista[i] = o; else lista.push(o);
  }
  if (S && S.os) for (const o of novo.os) { const a = S.os.find(x => x.id === o.id); if (!a || a.status !== o.status) UI.destaque[o.id] = Date.now(); }
  novo.auditoria.sort((a, b) => b.em.localeCompare(a.em));
  S = novo; SNAP = snap; SERVIDOR = srv;
  if (UI.user) { const eu = S.perfis.find(p => p.id === UI.user.id); if (eu) UI.user = eu; }
  guardarLocal();
}
async function puxarERender() {
  if (ENVIANDO) { PUXAR_DEPOIS = true; return; }
  try { await puxar(); SEM_REDE = false; } catch (e) { SEM_REDE = ehErroDeRede(e); }
  renderSeguro();
}
function agendarPuxar() { clearTimeout(TMR_PUXAR); TMR_PUXAR = setTimeout(puxarERender, 600); }

function iniciarTempoReal() {
  if (!SB || CANAL) return;
  try {
    CANAL = SB.channel('locacambas-mudancas').on('postgres_changes', { event: '*', schema: 'public' }, () => agendarPuxar()).subscribe();
  } catch (e) { CANAL = null; }
}
function pararTempoReal() { if (SB && CANAL) { try { SB.removeChannel(CANAL); } catch (e) { } } CANAL = null; }

// Não redesenha a tela enquanto a pessoa está digitando ou com um formulário aberto.
function renderSeguro() {
  const a = document.activeElement, digitando = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.closest('.filtros');
  if ((UI.modal && UI.modal.tipo && /-form$|^pg-form$|^usu-supabase$/.test(UI.modal.tipo)) || digitando) { PENDENTE_RENDER = true; atualizarStatusSync(); return; }
  PENDENTE_RENDER = false; render();
}
setInterval(() => { if (PENDENTE_RENDER) renderSeguro(); }, 1500);
setInterval(() => { if (SB && UI.user && FILA.length) enviarFila(); }, 15000);
setInterval(() => { if (SB && UI.user && navigator.onLine && !UI.modal) agendarPuxar(); }, 60000);
window.addEventListener('online', () => { if (SB && UI.user) { SEM_REDE = false; enviarFila(); agendarPuxar(); atualizarStatusSync(); } });
window.addEventListener('offline', () => { SEM_REDE = true; atualizarStatusSync(); });

// ---------------------------------------------------------------- situação da sincronização (topo da tela)
function textoStatusSync() {
  if (!SB_ATIVO || !UI.user) return null;
  const n = FILA.length;
  if (!navigator.onLine || SEM_REDE) return { cls: 'off', txt: `Sem internet${n ? ` · ${n} alteração(ões) aguardando envio` : ''}` };
  if (ENVIANDO || n) return { cls: 'env', txt: `Enviando${n ? ` ${n} alteração(ões)` : ''}…` };
  return { cls: 'ok', txt: 'Sincronizado' };
}
function htmlStatusSync() { const s = textoStatusSync(); return s ? `<span class="sync sync-${s.cls}" id="sync-status">${esc(s.txt)}</span>` : ''; }
function atualizarStatusSync() {
  const el = document.getElementById('sync-status'), s = textoStatusSync();
  if (el && s) { el.className = `sync sync-${s.cls}`; el.textContent = s.txt; }
  const m = document.getElementById('m-rede-txt'); if (m && s) { m.textContent = s.txt; m.closest('.m-rede').classList.toggle('off', s.cls === 'off'); }
}

// ---------------------------------------------------------------- fotos do Storage
const FOTO_VAZIA = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120"><rect width="160" height="120" fill="#eef0f3"/><text x="80" y="64" font-family="Arial" font-size="11" text-anchor="middle" fill="#8a93a3">carregando…</text></svg>');
let PEDIDOS_URL = new Set(), TMR_URL = null;
function urlDaFoto(path) {
  if (FOTO_CACHE[path]) return FOTO_CACHE[path];
  if (FOTO_URL[path]) return FOTO_URL[path];
  if (SB) { PEDIDOS_URL.add(path); clearTimeout(TMR_URL); TMR_URL = setTimeout(buscarUrls, 60); }
  return FOTO_VAZIA;
}
async function buscarUrls() {
  const paths = [...PEDIDOS_URL]; PEDIDOS_URL = new Set();
  if (!paths.length || !SB) return;
  try {
    const { data, error } = await SB.storage.from('fotos').createSignedUrls(paths, 3600);
    if (error || !data) return;
    for (const x of data) if (x.signedUrl) {
      FOTO_URL[x.path] = x.signedUrl;
      document.querySelectorAll(`img[data-path="${CSS.escape(x.path)}"]`).forEach(img => { img.src = x.signedUrl; });
    }
  } catch (e) { /* sem internet: tenta na próxima vez que a tela for desenhada */ }
}

// ---------------------------------------------------------------- apagar tudo (administrador)
async function zerarBanco() {
  for (const [tabela, pk] of [['pagamentos', 'id'], ['cobrancas', 'id'], ['series_mensais', 'serie'], ['movimentacoes', 'id'], ['ordens_servico', 'id'], ['locacoes', 'id'], ['clientes', 'id'], ['cacambas', 'id'], ['auditoria', 'id']]) {
    const { error } = await SB.from(tabela).delete().neq(pk, '');
    if (error) throw erroBanco(error);
  }
  FILA = []; await puxar();

   App instalável (PWA): ícone na tela inicial e tela cheia
   ===================================================================== */
let PEDIDO_INSTALAR = null;
const EH_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const EH_APP = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const EH_SITE = window.isSecureContext && location.protocol !== 'file:';
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PEDIDO_INSTALAR = e; if (!UI.user) render(); });
window.addEventListener('appinstalled', () => { PEDIDO_INSTALAR = null; toast('App instalado. Abra pelo ícone Locaçambas.', 'ok'); if (!UI.user) render(); });
if ('serviceWorker' in navigator && EH_SITE) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
function blocoInstalar() {
  if (EH_APP || !EH_SITE || !document.querySelector('link[rel=manifest]')) return '';
  if (PEDIDO_INSTALAR) return `<button type="button" class="btn sec cheio" data-act="instalar" style="margin-top:14px">${ic('celular')}Instalar app</button>`;
  if (EH_IOS) return `<p class="sub" style="text-align:center;margin-top:16px">Para instalar no iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p>`;
  return '';
}
async function instalarApp() {
  if (!PEDIDO_INSTALAR) return;
  PEDIDO_INSTALAR.prompt();
  try { await PEDIDO_INSTALAR.userChoice; } catch (e) { }
  PEDIDO_INSTALAR = null; render();
}

// ---------------------------------------------------------------- dashboard
function indicadoresFin() {
  const hoje = hojeISO(), ym = mesAtual();
  const cbs = S.cobrancas.filter(c => !c.cancelada).map(c => ({ c, s: situacaoCobranca(c, hoje) }));
  const pagMes = S.pagamentos.filter(p => p.data.slice(0, 7) === ym);
  const atrasadas = cbs.filter(x => x.s.sit === 'atrasado');
  return {
    aReceber: soma(cbs, x => x.s.saldo),
    recebidoMes: soma(pagMes, p => p.valor),
    emAberto: soma(cbs.filter(x => x.s.sit === 'pendente' || x.s.sit === 'parcial'), x => x.s.saldo),
    emAtraso: soma(atrasadas, x => x.s.saldo),
    faturamentoMes: soma(cbs.filter(x => x.c.emissao.slice(0, 7) === ym), x => x.c.valor),
    inadimplentes: [...new Set(atrasadas.map(x => x.c.cliente_id))],
    atrasadas,
  };
}

  const F = indicadoresFin(), ym = mesAtual(), hoje = hojeISO();
  const cac = S.cacambas, op = cac.filter(c => c.status === 'em_operacao').length, disp = cac.filter(c => c.status === 'disponivel').length;

  const concl = S.os.filter(o => o.status === 'concluida' && o.concluida_em.slice(0, 7) === ym).length;
  const ctAtivos = seriesMensais(false).length;
  const serie = [];
  for (let i = -5; i <= 0; i++) {
    const m = addMes(ym, i);
    serie.push({ rot: nomeMes(m), atual: i === 0, a: soma(S.cobrancas.filter(c => !c.cancelada && c.emissao.slice(0, 7) === m), c => c.valor), b: soma(S.pagamentos.filter(p => p.data.slice(0, 7) === m), p => p.valor) });
  }
  const st = ['em_operacao', 'disponivel', 'manutencao', 'indisponivel'], cores = { em_operacao: '#4b3bef', disponivel: '#1e7b46', manutencao: '#e8862e', indisponivel: '#8a93a3' };
  const frota = st.map(s => ({ s, n: cac.filter(c => c.status === s).length })).filter(x => x.n);
  const osHoje = S.os.filter(o => o.agendada_para.slice(0, 10) === hoje).sort((a, b) => a.agendada_para.localeCompare(b.agendada_para));
  const inad = F.inadimplentes.map(id => ({ id, v: soma(F.atrasadas.filter(x => x.c.cliente_id === id), x => x.s.saldo) })).sort((a, b) => b.v - a.v);
  return `<div class="kpis">

      ${kpi('c-azul', 'mapa', op, 'em operação')}

      ${kpi('c-laranja', 'os', abertas, 'O.S. abertas')}
      ${kpi('c-agua', 'check', concl, `O.S. concluídas em ${MESES[Number(ym.slice(5)) - 1]}`)}
      ${kpi('c-roxo', 'contratos', ctAtivos, 'locações mensais ativas')}
      ${kpi('c-azul', 'financeiro', brl(F.faturamentoMes), 'faturamento do mês')}

      ${kpi('c-laranja', 'relogio', brl(F.aReceber), 'valores pendentes')}
      ${kpi('c-vermelho', 'alerta', F.inadimplentes.length, 'clientes inadimplentes')}
    </div>
    <div class="duas">
      <div class="cartao"><div class="cab"><h2>Faturamento x recebido</h2><div class="legenda"><span><i style="background:#4b3bef"></i>Faturado (emitido)</span><span><i style="background:#3fd0c0"></i>Recebido</span></div></div>${graficoBarras(serie)}</div>

        ${frota.length ? '' : '<p class="sub">Nenhuma caçamba cadastrada.</p>'}<div class="barra-frota">${frota.map(x => `<div style="flex:${x.n};background:${cores[x.s]}" title="${ROT.statusCac[x.s]}: ${x.n}">${x.n}</div>`).join('')}</div>

        <h2 style="margin-top:22px">Inadimplência por cliente</h2>
        ${inad.length ? tabela(['Cliente', { t: 'Em atraso', c: 'num' }], inad.map(x => `<tr class="clic" data-act="cli-ver" data-id="${x.id}"><td>${esc(nomeCli(x.id))}</td><td class="num">${brl(x.v)}</td></tr>`)) : '<p class="sub">Nenhum cliente em atraso.</p>'}

}

  const ct = seriesMensais(false).some(l => l.cliente_id === c.id);

  const saldo = soma(S.cobrancas.filter(x => x.cliente_id === c.id && !x.cancelada), x => situacaoCobranca(x).saldo);
  const atraso = S.cobrancas.some(x => x.cliente_id === c.id && situacaoCobranca(x).sit === 'atrasado');
  return { ct, pos, saldo, atraso };
}

    return `<tr class="clic" ${origem ? `data-act="os-ver" data-id="${origem.id}"` : ''}><td class="nw"><b>${origem ? origem.numero : '—'}</b></td><td>${esc(nomeCli(l.cliente_id))}<div class="sub">${esc(l.endereco)}</div></td>
      <td class="nw">${l.cacamba_id ? numCac(l.cacamba_id) : '<span class="sub">a entregar</span>'} <span class="tag">${fmtM3(l.capacidade)}</span></td>

  });
  return `<div class="cartao"><div class="filtros">
      <label>Situação<select data-change="f.mens.status">${opt('ativas', 'Ativas', f.status)}${opt('encerradas', 'Encerradas', f.status)}${opt('todas', 'Todas', f.status)}</select></label>

    ${tabela(['O.S. de origem', 'Cliente', 'Caçamba', { t: 'Valor mensal', c: 'num' }, 'Vencimento', 'Período', { t: 'Cobranças', c: 'num' }, `Mensalidade ${fmtComp(ym)}`, 'Situação'], linhas, 'Nenhuma locação mensal. Crie uma O.S. de entrega e marque "Mensal".')}
    <p class="sub" style="margin-top:10px">${lista.length} locação(ões) mensal(is)</p></div>`;
}

// ---------------------------------------------------------------- financeiro
function filtrarCobrancas() {
  const f = UI.f.fin;
  return S.cobrancas.map(c => ({ c, s: situacaoCobranca(c) })).filter(({ c, s }) =>
    (!f.de || c.vencimento >= f.de) && (!f.ate || c.vencimento <= f.ate) && (!f.cli || c.cliente_id === f.cli) &&
    (!f.sit || (f.sit === 'abertas' ? ['pendente', 'parcial', 'atrasado'].includes(s.sit) : s.sit === f.sit)) &&
    (!f.q.trim() || [c.numero, (osDaCobranca(c) || {}).numero, nomeCli(c.cliente_id), c.descricao].join(' ').toLowerCase().includes(f.q.trim().toLowerCase())))
    .sort((a, b) => a.c.vencimento.localeCompare(b.c.vencimento) * (UI.f.fin.sit === 'abertas' ? 1 : -1));
}
function refCobranca(c) {
  const os = osDaCobranca(c);
  return `${os ? `<b>${os.numero}</b>` : '<span class="sub">avulsa</span>'}${c.competencia ? `<div class="sub">mensal ${fmtComp(c.competencia)}</div>` : os ? `<div class="sub">${ROT.tipoOS[os.tipo]}</div>` : ''}`;
}
function vFinanceiro() {
  const F = indicadoresFin(), f = UI.f.fin, lista = filtrarCobrancas();
  const linhas = lista.map(({ c, s }) => `<tr class="clic" data-act="cb-ver" data-id="${c.id}"><td class="nw">${refCobranca(c)}</td><td style="min-width:160px">${esc(nomeCli(c.cliente_id))}</td>
    <td style="min-width:220px">${esc(c.descricao)}</td><td class="num">${brl(c.valor)}</td><td class="num">${s.pago ? brl(s.pago) : '—'}</td><td class="num"><b>${s.saldo ? brl(s.saldo) : '—'}</b></td>
    <td class="nw">${fmtData(c.emissao)}</td><td class="nw">${fmtData(c.vencimento)}${s.diasAtraso ? `<div class="sub" style="color:var(--erro)">${s.diasAtraso} dia(s)</div>` : ''}</td><td class="nw">${s.ultimo ? fmtData(s.ultimo) : '—'}</td>
    <td>${seloCobranca(c)}</td><td>${!c.cancelada && s.saldo > 0 ? `<button class="btn peq" data-act="pg-novo" data-id="${c.id}">Dar baixa</button>` : ''}</td></tr>`);
  const tot = `<tr><td colspan="3">Total (${lista.length})</td><td class="num">${brl(soma(lista, x => x.c.cancelada ? 0 : x.c.valor))}</td><td class="num">${brl(soma(lista, x => x.s.pago))}</td><td class="num">${brl(soma(lista, x => x.s.saldo))}</td><td colspan="5"></td></tr>`;
  const inad = F.inadimplentes.map(id => {
    const at = F.atrasadas.filter(x => x.c.cliente_id === id);
    return { id, n: at.length, v: soma(at, x => x.s.saldo), d: Math.max(...at.map(x => x.s.diasAtraso)) };
  }).sort((a, b) => b.v - a.v);
  return `<div class="kpis">
      ${kpi('c-roxo', 'financeiro', brl(F.aReceber), 'total a receber')}
      ${kpi('c-verde', 'check', brl(F.recebidoMes), 'recebido no mês')}
      ${kpi('c-azul', 'relogio', brl(F.emAberto), 'em aberto (a vencer)')}
      ${kpi('c-vermelho', 'alerta', brl(F.emAtraso), 'em atraso')}
      ${kpi('c-agua', 'relatorios', brl(F.faturamentoMes), 'faturamento do mês')}
    </div>
    <div class="cartao" style="margin-top:18px"><div class="filtros">
      <label>Vencimento de<input type="date" data-change="f.fin.de" value="${f.de}"></label>
      <label>até<input type="date" data-change="f.fin.ate" value="${f.ate}"></label>
      <label>Cliente<select data-change="f.fin.cli">${opt('', 'Todos', f.cli)}${S.clientes.map(c => opt(c.id, c.nome, f.cli)).join('')}</select></label>
      <label>Buscar<input id="f-fin-q" data-input="f.fin.q" value="${esc(f.q)}" placeholder="Nº da O.S., cliente"></label>
      <label>Situação<select data-change="f.fin.sit">${opt('abertas', 'Em aberto (todas)', f.sit)}${Object.entries(ROT.situacao).map(([k, v]) => opt(k, v, f.sit)).join('')}${opt('', 'Todas', f.sit)}</select></label>
      <span style="flex:1"></span><button class="btn sec" data-act="mens-gerar">Gerar mensalidades</button><button class="btn" data-act="cb-nova">${ic('mais')}Nova cobrança</button></div>
    ${tabela(['O.S.', 'Cliente', 'Descrição', { t: 'Valor', c: 'num' }, { t: 'Pago', c: 'num' }, { t: 'Saldo', c: 'num' }, 'Emissão', 'Vencimento', 'Pagamento', 'Situação', ''], linhas, 'Nenhuma cobrança com esses filtros.', tot)}</div>
    <div class="cartao"><h2>Inadimplência por cliente</h2>
    ${tabela(['Cliente', { t: 'Cobranças em atraso', c: 'num' }, { t: 'Maior atraso', c: 'num' }, { t: 'Valor em atraso', c: 'num' }, ''], inad.map(x => `<tr><td>${esc(nomeCli(x.id))}</td><td class="num">${x.n}</td><td class="num">${x.d} dia(s)</td><td class="num"><b>${brl(x.v)}</b></td><td><button class="btn sec peq" data-act="cli-ver" data-id="${x.id}">Histórico</button></td></tr>`), 'Nenhum cliente em atraso.')}</div>`;
}

// ---------------------------------------------------------------- relatórios
const RELATORIOS = {
  os: { t: 'Ordens de serviço por período', fin: false },
  entregas: { t: 'Entregas e retiradas', fin: false },
  movimentacao: { t: 'Movimentação das caçambas', fin: false },
  clientes: { t: 'Clientes ativos', fin: true },
  mensais: { t: 'Locações mensais', fin: true },
  faturamento: { t: 'Faturamento', fin: true },
  pagamentos: { t: 'Pagamentos recebidos', fin: true },
  pendentes: { t: 'Contas pendentes', fin: true },
  inadimplencia: { t: 'Inadimplência', fin: true },
};
function dadosRelatorio(tipo, de, ate) {
  const no = d => (!de || d >= de) && (!ate || d <= ate);
  switch (tipo) {
    case 'os': { const l = S.os.filter(o => no(o.agendada_para.slice(0, 10))).sort((a, b) => a.agendada_para.localeCompare(b.agendada_para));
      return { cab: ['Nº', 'Agendada', 'Cliente', 'Tipo', 'Caçamba(s)', 'Motorista', 'Status', 'Concluída em'], linhas: l.map(o => [o.numero, fmtDataHora(o.agendada_para), nomeCli(o.cliente_id), ROT.tipoOS[o.tipo], [numCac(o.cacamba_retirada_id), numCac(o.cacamba_entregue_id)].filter(Boolean).join(' → '), nomeUsu(o.motorista_id), ROT.statusOS[o.status], fmtDataHora(o.concluida_em)]) }; }
    case 'entregas': { const l = S.os.filter(o => o.status === 'concluida' && no(o.concluida_em.slice(0, 10))).sort((a, b) => a.concluida_em.localeCompare(b.concluida_em));
      return { cab: ['Data', 'Nº', 'Tipo', 'Cliente', 'Endereço', 'Caçamba retirada', 'Caçamba entregue', 'Motorista'], linhas: l.map(o => [fmtDataHora(o.concluida_em), o.numero, ROT.tipoOS[o.tipo], nomeCli(o.cliente_id), o.endereco, numCac(o.cacamba_retirada_id) || '—', numCac(o.cacamba_entregue_id) || '—', nomeUsu(o.motorista_id)]),
        resumo: `${l.filter(o => o.tipo === 'entrega').length} entregas · ${l.filter(o => o.tipo === 'retirada').length} retiradas · ${l.filter(o => o.tipo === 'substituicao').length} substituições` }; }
    case 'movimentacao': { const l = S.movimentacoes.filter(m => no(m.em.slice(0, 10))).sort((a, b) => a.em.localeCompare(b.em));
      return { cab: ['Data', 'Caçamba', 'Movimento', 'Cliente', 'Endereço', 'Coordenadas', 'O.S.'], linhas: l.map(m => [fmtDataHora(m.em), numCac(m.cacamba_id), m.tipo === 'entrega' ? 'Entrega' : 'Retirada', nomeCli(m.cliente_id), m.endereco, `${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}`, ordem(m.os_id).numero]) }; }
    case 'clientes': { const l = S.clientes.filter(c => c.ativo && (seriesMensais(false).some(x => x.cliente_id === c.id) || locacoesAtivas().some(x => x.cliente_id === c.id) || S.os.some(o => o.cliente_id === c.id && no(o.agendada_para.slice(0, 10)))));
      return { cab: ['Cliente', 'CPF/CNPJ', 'Telefone', 'Bairro', 'Caçambas na obra', 'Mensal ativa', 'Saldo em aberto'], linhas: l.map(c => { const r = resumoCliente(c); return [c.nome, fmtDoc(c.doc), fmtFone(c.telefone), c.bairro, r.pos, r.ct ? 'Sim' : 'Não', brl(r.saldo)]; }) }; }
    case 'mensais': { const l = seriesMensais(true); return { cab: ['O.S. de origem', 'Cliente', 'Caçamba', 'Valor mensal', 'Dia de vencimento', 'Entrega', 'Retirada', 'Situação'], linhas: l.map(x => { const o = S.os.find(y => y.locacao_id === x.serie && y.tipo === 'entrega'); return [o ? o.numero : '—', nomeCli(x.cliente_id), x.cacamba_id ? numCac(x.cacamba_id) : 'a entregar', brl(x.valor_mensal), x.dia_cobranca, fmtData(x.data_entrega), fmtData(x.data_retirada), x.status === 'encerrada' ? 'Encerrada' : x.status === 'agendada' ? 'Aguardando entrega' : 'Ativa']; }),
      resumo: `Receita mensal (ativas): ${brl(soma(seriesMensais(false), x => x.valor_mensal))}` }; }
    case 'faturamento': { const l = S.cobrancas.filter(c => !c.cancelada && no(c.emissao)).sort((a, b) => a.emissao.localeCompare(b.emissao));
      return { cab: ['Emissão', 'Nº', 'Cliente', 'Descrição', 'Valor', 'Situação'], linhas: l.map(c => [fmtData(c.emissao), c.numero, nomeCli(c.cliente_id), c.descricao, brl(c.valor), ROT.situacao[situacaoCobranca(c).sit]]), resumo: `Total faturado: ${brl(soma(l, c => c.valor))}` }; }
    case 'pagamentos': { const l = S.pagamentos.filter(p => no(p.data)).sort((a, b) => a.data.localeCompare(b.data));
      return { cab: ['Data', 'Cobrança', 'Cliente', 'Forma', 'Valor', 'Registrado por'], linhas: l.map(p => { const c = cobranca(p.cobranca_id); return [fmtData(p.data), c.numero, nomeCli(c.cliente_id), ROT.forma[p.forma], brl(p.valor), nomeUsu(p.por)]; }), resumo: `Total recebido: ${brl(soma(l, p => p.valor))}` }; }
    case 'pendentes': { const l = S.cobrancas.map(c => ({ c, s: situacaoCobranca(c) })).filter(x => x.s.saldo > 0 && no(x.c.vencimento)).sort((a, b) => a.c.vencimento.localeCompare(b.c.vencimento));
      return { cab: ['Vencimento', 'Nº', 'Cliente', 'Descrição', 'Valor', 'Pago', 'Saldo', 'Situação'], linhas: l.map(({ c, s }) => [fmtData(c.vencimento), c.numero, nomeCli(c.cliente_id), c.descricao, brl(c.valor), brl(s.pago), brl(s.saldo), ROT.situacao[s.sit]]), resumo: `Total pendente: ${brl(soma(l, x => x.s.saldo))}` }; }
    case 'inadimplencia': { const at = S.cobrancas.map(c => ({ c, s: situacaoCobranca(c) })).filter(x => x.s.sit === 'atrasado');
      const ids = [...new Set(at.map(x => x.c.cliente_id))];
      const l = ids.map(id => { const a = at.filter(x => x.c.cliente_id === id); return { id, n: a.length, v: soma(a, x => x.s.saldo), d: Math.max(...a.map(x => x.s.diasAtraso)) }; }).sort((a, b) => b.v - a.v);
      return { cab: ['Cliente', 'Telefone', 'Cobranças em atraso', 'Maior atraso (dias)', 'Valor em atraso'], linhas: l.map(x => [nomeCli(x.id), fmtFone(cliente(x.id).telefone), x.n, x.d, brl(x.v)]), resumo: `Total em atraso: ${brl(soma(l, x => x.v))}` }; }
  }
}
function vRelatorios() {
  const f = UI.f.rel;
  const tipos = Object.entries(RELATORIOS).filter(([, r]) => ehAdmin() || r.fin);
  if (!tipos.some(([k]) => k === f.tipo)) f.tipo = tipos[0][0];
  const d = dadosRelatorio(f.tipo, f.de, f.ate);
  const semPeriodo = ['mensais', 'inadimplencia'].includes(f.tipo);
  return `<div class="cartao"><div class="filtros">
      <label>Relatório<select data-change="f.rel.tipo">${tipos.map(([k, r]) => opt(k, r.t, f.tipo)).join('')}</select></label>
      ${semPeriodo ? '' : `<label>De<input type="date" data-change="f.rel.de" value="${f.de}"></label><label>Até<input type="date" data-change="f.rel.ate" value="${f.ate}"></label>`}
      <span style="flex:1"></span><button class="btn sec" data-act="rel-copiar">${ic('copiar')}Copiar para o Excel</button></div>
    <h2>${RELATORIOS[f.tipo].t}${!semPeriodo && (f.de || f.ate) ? ` · ${f.de ? fmtData(f.de) : 'início'} a ${f.ate ? fmtData(f.ate) : 'hoje'}` : ''}</h2>
    ${d.resumo ? `<div class="aviso" style="margin-bottom:12px">${esc(d.resumo)}</div>` : ''}
    ${tabela(d.cab, d.linhas.map(l => `<tr>${l.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`), 'Nenhum registro no período.')}

}

    const abaHTML = {
      servicos: () => tabela(['Nº', 'Data', 'Tipo', 'Caçamba', 'Motorista', 'Status'], oss.map(o => `<tr class="clic" data-act="os-ver" data-id="${o.id}"><td class="nw"><b>${o.numero}</b></td><td class="nw">${fmtDataHora(o.concluida_em || o.agendada_para)}</td><td>${ROT.tipoOS[o.tipo]}</td><td class="nw">${cacambasDaOS(o)}</td><td>${esc(nomeUsu(o.motorista_id))}</td><td>${selo('statusOS', o.status)}</td></tr>`), 'Nenhum serviço.'),
      financeiro: () => `<div class="aviso ${r.saldo ? 'alerta' : 'ok'}" style="margin-bottom:12px">Saldo em aberto: <b>${brl(r.saldo)}</b> · Total pago: ${brl(soma(cbs, x => x.cancelada ? 0 : pagoDe(x)))}</div>` +
        tabela(['Nº', 'Descrição', { t: 'Valor', c: 'num' }, { t: 'Saldo', c: 'num' }, 'Vencimento', 'Situação'], cbs.map(x => { const s = situacaoCobranca(x); return `<tr class="clic" data-act="cb-ver" data-id="${x.id}"><td class="nw">${x.numero}</td><td>${esc(x.descricao)}</td><td class="num">${brl(x.valor)}</td><td class="num">${s.saldo ? brl(s.saldo) : '—'}</td><td class="nw">${fmtData(x.vencimento)}</td><td>${seloCobranca(x)}</td></tr>`; }), 'Nenhuma cobrança.'),
      contratos: () => tabela(['O.S. de origem', 'Caçamba', { t: 'Valor mensal', c: 'num' }, 'Vencimento', 'Situação'], cts.map(x => { const o = S.os.find(y => y.locacao_id === x.serie && y.tipo === 'entrega'); return `<tr class="clic" ${o ? `data-act="os-ver" data-id="${o.id}"` : ''}><td>${o ? o.numero : '—'}</td><td>${x.cacamba_id ? numCac(x.cacamba_id) : 'a entregar'} (${fmtM3(x.capacidade)})</td><td class="num">${brl(x.valor_mensal)}</td><td>dia ${x.dia_cobranca}</td><td>${x.status === 'encerrada' ? 'Encerrada' : 'Ativa'}</td></tr>`; }), 'Nenhuma locação mensal.'),
    };
    return {
      t: c.nome, cls: 'larga',
      corpo: `<div class="dados">
          <div><small>${c.tipo === 'PJ' ? 'CNPJ' : 'CPF'}</small>${fmtDoc(c.doc)}</div><div><small>Telefone</small>${fmtFone(c.telefone)}</div><div><small>WhatsApp</small>${c.whatsapp ? fmtFone(c.whatsapp) : '—'}</div>
          <div><small>E-mail</small>${esc(c.email || '—')}</div><div><small>Endereço</small>${esc(c.endereco)} — ${esc(c.bairro)}, ${esc(c.cidade)}</div><div><small>Coordenadas</small>${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</div>
          ${c.obs ? `<div style="grid-column:span 3"><small>Observações</small>${esc(c.obs)}</div>` : ''}</div>
        <div class="abas">${[['servicos', `Serviços (${oss.length})`], ['financeiro', `Financeiro (${cbs.length})`], ['contratos', `Mensais (${cts.length})`]].map(([k, t]) => `<button type="button" class="${aba === k ? 'ativo' : ''}" data-act="aba" data-aba="${k}">${t}</button>`).join('')}</div>
        ${abaHTML[aba]()}`,
      rodape: `${ehAdmin() ? `<div class="esq"><button class="btn sec" data-act="cli-editar" data-id="${c.id}">Editar</button><button class="btn sec" data-act="os-nova" data-cli="${c.id}">${ic('mais')}Nova O.S.</button></div>` : ''}<button class="btn sec" data-act="fechar">Fechar</button>`,
    };
  },

  // ------------------------------------------------------------ caçambas
  'cac-form'(m) {
    return {
      t: 'Nova caçamba', form: 'cac-form', cls: 'estreita',
      corpo: `<div class="form">${campo('Número de identificação *', `<input name="numero" value="${esc(val(m, 'numero', `C-${pad(S.cacambas.length + 1)}`))}">`, 's6', 'Único. Ex.: C-13')}
        ${campo('Capacidade *', `<div class="opcoes"><label><input type="radio" name="capacidade" value="4" ${val(m, 'capacidade', '4') === '4' ? 'checked' : ''}>4 m³</label><label><input type="radio" name="capacidade" value="5" ${val(m, 'capacidade', '4') === '5' ? 'checked' : ''}>5 m³</label></div>`, 's6')}
        ${campo('Observações', `<textarea name="obs">${esc(val(m, 'obs', ''))}</textarea>`, 's6')}</div>`,
      rodape: `${btnFechar}<button class="btn">Cadastrar</button>`,
    };
  },
  'cac-status'(m) {
    const c = cacamba(m.d.id);
    return {
      t: `Status da caçamba ${c.numero}`, form: 'cac-status', cls: 'estreita',
      corpo: `<div class="form">${campo('Status', `<select name="status">${['disponivel', 'manutencao', 'indisponivel'].map(s => opt(s, ROT.statusCac[s], c.status)).join('')}</select>`, 's6')}
        ${campo('Observação', `<textarea name="obs" placeholder="Ex.: solda na alça lateral">${esc(c.obs)}</textarea>`, 's6')}</div>`,
      rodape: `${btnFechar}<button class="btn">Salvar</button>`,
    };
  },
  'cac-hist'(m) {
    const c = cacamba(m.d.id);
    const movs = S.movimentacoes.filter(x => x.cacamba_id === c.id).sort((a, b) => b.em.localeCompare(a.em));
    return {
      t: `Histórico da caçamba ${c.numero} (${fmtM3(c.capacidade)})`, cls: 'larga',
      corpo: `<p>${selo('statusCac', c.status)} · ${movs.length} movimentação(ões)</p>${tabela(['Data e hora', 'Movimento', 'Cliente', 'Endereço', 'Coordenadas', 'O.S.'], movs.map(x => `<tr><td class="nw">${fmtDataHora(x.em)}</td><td>${x.tipo === 'entrega' ? '<span class="selo s-roxo">Entrega</span>' : '<span class="selo s-laranja">Retirada</span>'}</td><td>${esc(nomeCli(x.cliente_id))}</td><td>${esc(x.endereco)}</td><td class="nw mono">${x.lat.toFixed(5)}, ${x.lng.toFixed(5)}</td><td class="nw"><button class="lnk" data-act="os-ver" data-id="${x.os_id}">${ordem(x.os_id).numero}</button></td></tr>`), 'Sem movimentações.')}`,
      rodape: '<button class="btn sec" data-act="fechar">Fechar</button>',
    };
  },

  // ------------------------------------------------------------ ordens de serviço
  'os-form'(m) {
    const tipo = val(m, 'tipo', 'entrega'), cliId = val(m, 'cliente_id', ''), c = cliId ? cliente(cliId) : null;
    const modalidade = val(m, 'modalidade', 'normal'), mensal = modalidade === 'mensal';
    const locs = c ? locacoesAtivas().filter(l => l.cliente_id === c.id) : [];
    const locId = val(m, 'locacao_id', ''), loc = locId ? locacao(locId) : null;
    const data = val(m, 'data', hojeISO()), cap = val(m, 'capacidade', loc ? String(loc.capacidade) : '4');
    const lat = val(m, 'lat', ''), lng = val(m, 'lng', '');
    let corpo = `<div class="form">
      ${campo('Tipo de serviço *', `<div class="opcoes">${Object.entries(ROT.tipoOS).map(([k, v]) => `<label><input type="radio" name="tipo" value="${k}" data-refresh ${tipo === k ? 'checked' : ''}>${v}</label>`).join('')}</div>`, 's6')}
      ${campo('Cliente *', `<select name="cliente_id" data-refresh><option value="">Selecione…</option>${S.clientes.filter(x => x.ativo).sort((a, b) => a.nome.localeCompare(b.nome)).map(x => opt(x.id, x.nome, cliId)).join('')}</select>`, 's4', ehAdmin() ? '<button type="button" class="lnk" data-act="cli-novo-os">+ cadastrar novo cliente</button>' : '')}`;
    if (tipo === 'entrega') {
      corpo += campo('Tipo de locação *', `<div class="opcoes"><label><input type="radio" name="modalidade" value="normal" data-refresh ${!mensal ? 'checked' : ''}>Locação normal</label><label><input type="radio" name="modalidade" value="mensal" data-refresh ${mensal ? 'checked' : ''}>Mensal</label></div>`, 's2');
      corpo += campo('Tamanho da caçamba *', `<div class="opcoes">${['4', '5'].map(k => `<label><input type="radio" name="capacidade" value="${k}" ${cap === k ? 'checked' : ''}>${k} m³</label>`).join('')}</div>`, 's6');
      corpo += campo('Endereço do serviço *', `<input name="endereco" value="${esc(val(m, 'endereco', ''))}">`, 's6');
      corpo += `<div class="campo s6"><label class="r">Local de entrega no mapa * <span class="sub" id="pin-txt">${lat !== '' ? `${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}` : 'clique no mapa para marcar'}</span></label>${mapaSVG({ pick: true, pin: lat !== '' ? { lat: Number(lat), lng: Number(lng) } : null, altura: 300 })}<input type="hidden" name="lat" value="${lat}"><input type="hidden" name="lng" value="${lng}"></div>`;
    } else {
      corpo += campo('Caçamba posicionada *', `<select name="locacao_id" data-refresh><option value="">${c ? (locs.length ? 'Selecione…' : 'Cliente sem caçamba posicionada') : 'Selecione o cliente'}</option>${locs.map(l => opt(l.id, `${numCac(l.cacamba_id)} (${fmtM3(l.capacidade)})${l.mensal ? ' · mensal' : ''}`, locId)).join('')}</select>`, 's2');
      if (loc) corpo += `<div class="campo s6"><div class="aviso">Endereço: <b>${esc(loc.endereco)}</b> · no local desde ${fmtData(loc.data_entrega)}${loc.mensal ? ` · locação mensal de ${brl(loc.valor_mensal)} (a mensalidade continua)` : ''}</div></div>`;
      if (tipo === 'substituicao') corpo += campo('Tamanho da caçamba nova *', `<div class="opcoes">${['4', '5'].map(k => `<label><input type="radio" name="capacidade" value="${k}" ${cap === k ? 'checked' : ''}>${k} m³</label>`).join('')}</div>`, 's6');
    }
    corpo += `<div class="secao-form">Agenda</div>`;
    corpo += campo('Motorista responsável *', `<select name="motorista_id">${motoristas().filter(x => x.ativo).map(x => opt(x.id, x.nome, val(m, 'motorista_id', 'u-cassio'))).join('')}</select>`, 's2');
    corpo += campo('Data *', `<input type="date" name="data" value="${data}" data-refresh>`, 's2');
    corpo += campo('Horário *', `<input type="time" name="hora" value="${val(m, 'hora', '08:00')}">`, 's2');
    if (tipo === 'entrega' && !mensal) corpo += campo('Previsão de retirada *', `<input type="date" name="prev_retirada" value="${val(m, 'prev_retirada', addDias(data, 7))}">`, 's2');
    corpo += `<div class="secao-form">Financeiro</div>`;
    corpo += campo(tipo === 'entrega' ? (mensal ? 'Valor mensal (R$) *' : 'Valor da locação (R$) *') : 'Valor do serviço (R$) *', `<input name="valor" inputmode="decimal" placeholder="Ex.: 280,00" value="${esc(val(m, 'valor', ''))}">`, 's2', tipo === 'entrega' ? '' : 'Use 0 se não for cobrar.');
    corpo += campo(mensal && tipo === 'entrega' ? '1º vencimento *' : 'Vencimento *', `<input type="date" name="vencimento" value="${val(m, 'vencimento', data)}">`, 's2', mensal && tipo === 'entrega' ? 'Os próximos vencem no mesmo dia, todo mês.' : '');
    corpo += `<div class="secao-form">Detalhes</div>`;
    const fl = val(m, 'foto_local', null);
    corpo += campo('Fotografia inicial do local (opcional)', `<div style="display:flex;gap:12px;align-items:center">${fl ? `<img src="${fl}" style="width:110px;height:80px;object-fit:cover;border-radius:10px">` : ''}<input type="file" accept="image/*" data-file="foto_local" style="max-width:320px"></div>`, 's6');
    corpo += campo('Observações para o motorista', `<textarea name="obs">${esc(val(m, 'obs', ''))}</textarea>`, 's6');
    corpo += '</div>';
    return { t: 'Nova ordem de serviço', form: 'os-form', cls: 'larga', corpo, rodape: `${btnFechar}<button class="btn">Criar O.S.</button>` };
  },
  'os-ver'(m) {
    const o = ordem(m.d.id), cb = cobrancaDaOS(o), c = cliente(o.cliente_id);
    const exig = Object.entries(fotosExigidas(o)).map(([t, n]) => `${n} de "${ROT.fotoTipo[t]}"`).join(' + ');
    const aberta = ['aguardando', 'em_andamento'].includes(o.status);
    const linhaTempo = [['Criada', o.criada_em], ['Agendada', o.agendada_para], ['Iniciada', o.iniciada_em], ['Concluída', o.concluida_em]].filter(x => x[1]).map(([t, d]) => `<span class="tag">${t}: ${fmtDataHora(d)}</span>`).join(' ');
    return {
      t: `${o.numero} · ${ROT.tipoOS[o.tipo]}`, cls: 'larga',
      corpo: `<p>${selo('statusOS', o.status)} ${linhaTempo}</p>
        <div class="dados">
          <div><small>Cliente</small><button class="lnk" data-act="cli-ver" data-id="${c.id}">${esc(c.nome)}</button><div class="sub">${fmtFone(c.telefone)}</div></div>
          <div><small>Endereço</small>${esc(o.endereco)}</div><div><small>Coordenadas</small>${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</div>
          <div><small>Caçamba(s)</small>${cacambasDaOS(o)}</div><div><small>Capacidade</small>${fmtM3(o.capacidade)}</div><div><small>Motorista</small>${esc(nomeUsu(o.motorista_id))}</div>
          <div><small>Tipo de locação</small>${o.modalidade === 'mensal' ? `Mensal${locacao(o.locacao_id) ? ` · ${brl(locacao(o.locacao_id).valor_mensal)}/mês` : ''}` : 'Locação normal'}</div>
          ${ehAdmin() ? `<div><small>Cobrança</small>${cb ? `<button class="lnk" data-act="cb-ver" data-id="${cb.id}">${brl(cb.valor)}</button> · venc. ${fmtData(cb.vencimento)}<div>${seloCobranca(cb)}</div>` : '—'}</div>` : ''}
          <div><small>Fotos exigidas</small>${exig}</div>
          ${o.obs ? `<div style="grid-column:span 3"><small>Observações do administrador</small>${esc(o.obs)}</div>` : ''}
          ${o.obs_motorista ? `<div style="grid-column:span 3"><small>Observações do motorista</small>${esc(o.obs_motorista)}</div>` : ''}
          ${o.gps ? `<div style="grid-column:span 3"><small>GPS da conclusão</small>${o.gps.lat.toFixed(5)}, ${o.gps.lng.toFixed(5)} (precisão ±${o.gps.precisao} m) · <a href="https://www.openstreetmap.org/?mlat=${o.gps.lat}&mlon=${o.gps.lng}#map=18/${o.gps.lat}/${o.gps.lng}" target="_blank" rel="noopener">abrir no OpenStreetMap</a></div>` : ''}
        </div>
        ${o.excecao ? `<div class="aviso alerta" style="margin-bottom:12px"><b>Exceção de fotos autorizada</b> por ${esc(nomeUsu(o.excecao.por))} em ${fmtDataHora(o.excecao.em)}: ${esc(o.excecao.motivo)}</div>` : ''}
        ${o.cancelamento ? `<div class="aviso erro" style="margin-bottom:12px"><b>Cancelada</b> por ${esc(nomeUsu(o.cancelamento.por))} em ${fmtDataHora(o.cancelamento.em)}: ${esc(o.cancelamento.motivo)}</div>` : ''}
        ${o.foto_local ? `<h2 style="font-size:14px">Foto inicial do local</h2>${galeria([fotoLocal(o)])}` : ''}
        <h2 style="font-size:14px;margin-top:14px">Fotos de comprovação</h2>${galeria(o.fotos)}`,
      rodape: `${ehAdmin() && aberta ? `<div class="esq">${o.status === 'aguardando' ? `<button class="btn sec" data-act="os-editar" data-id="${o.id}">Editar</button>` : ''}${!o.excecao ? `<button class="btn sec" data-act="os-excecao" data-id="${o.id}">Autorizar sem fotos</button>` : ''}<button class="btn perigo" data-act="os-cancelar" data-id="${o.id}">Cancelar O.S.</button></div>` : ''}<button class="btn sec" data-act="fechar">Fechar</button>`,
    };
  },
  'os-editar'(m) {
    const o = ordem(m.d.id);
    return {
      t: `Editar ${o.numero}`, form: 'os-editar', cls: 'estreita',
      corpo: `<div class="form">
        ${campo('Motorista', `<select name="motorista_id">${motoristas().filter(x => x.ativo).map(x => opt(x.id, x.nome, o.motorista_id)).join('')}</select>`, 's6')}
        ${campo('Data', `<input type="date" name="data" value="${o.agendada_para.slice(0, 10)}">`, '')}${campo('Horário', `<input type="time" name="hora" value="${fmtHora(o.agendada_para)}">`, '')}
        ${campo('Observações', `<textarea name="obs">${esc(o.obs)}</textarea>`, 's6')}</div>`,
      rodape: `${btnFechar}<button class="btn">Salvar</button>`,
    };
  },
  'os-cancelar'(m) {
    const o = ordem(m.d.id);
    return { t: `Cancelar ${o.numero}`, form: 'os-cancelar', cls: 'estreita', corpo: `<div class="form">${campo('Motivo do cancelamento *', '<textarea name="motivo" required></textarea>', 's6', 'A cobrança vinculada (sem pagamentos) também será cancelada.')}</div>`, rodape: `<button type="button" class="btn sec" data-act="fechar">Voltar</button><button class="btn perigo">Cancelar O.S.</button>` };
  },
  'os-excecao'(m) {
    const o = ordem(m.d.id);
    return { t: `Autorizar conclusão sem fotos · ${o.numero}`, form: 'os-excecao', cls: 'estreita', corpo: `<div class="aviso alerta" style="margin-bottom:12px">O motorista poderá concluir sem as fotos obrigatórias. A autorização fica registrada com seu nome, data e motivo.</div><div class="form">${campo('Motivo *', '<textarea name="motivo" placeholder="Ex.: celular do motorista com a câmera quebrada"></textarea>', 's6')}</div>`, rodape: `${btnFechar}<button class="btn">Autorizar</button>` };
  },

  'mens-gerar'(m) {
    const ym = val(m, 'mes', mesAtual());
    const ativas = seriesMensais(false).filter(l => { const p = S.cobrancas.filter(c => c.serie === l.serie && c.competencia).map(c => c.competencia).sort()[0]; return !p || ym >= p; });
    const jaTem = ativas.filter(l => S.cobrancas.some(c => c.serie === l.serie && c.competencia === ym && !c.cancelada));
    return {
      t: 'Gerar mensalidades', form: 'mens-gerar', cls: 'estreita',
      corpo: `<div class="form">${campo('Mês', `<input type="month" name="mes" value="${ym}" data-refresh>`, 's6')}</div>
        <div class="aviso" style="margin-top:12px">${ativas.length} locação(ões) mensal(is) ativa(s) em ${nomeMesLongo(ym)}; ${jaTem.length} já com cobrança. ${ativas.length - jaTem.length ? `Serão geradas <b>${ativas.length - jaTem.length}</b>.` : 'Nada a gerar.'}</div>`,
      rodape: `${btnFechar}<button class="btn" ${ativas.length - jaTem.length ? '' : 'disabled'}>Gerar</button>`,
    };
  },

  // ------------------------------------------------------------ financeiro
  'cb-ver'(m) {
    const c = cobranca(m.d.id), s = situacaoCobranca(c), pgs = S.pagamentos.filter(p => p.cobranca_id === c.id).sort((a, b) => a.data.localeCompare(b.data));
    return {
      t: `Cobrança ${c.numero}`,
      corpo: `<p>${seloCobranca(c)}</p><div class="dados">
          <div><small>Cliente</small>${esc(nomeCli(c.cliente_id))}</div><div><small>O.S.</small>${osDaCobranca(c) ? `<button class="lnk" data-act="os-ver" data-id="${osDaCobranca(c).id}">${osDaCobranca(c).numero}</button>` : 'Avulsa'}${c.competencia ? ` · mensal ${fmtComp(c.competencia)}` : ''}</div><div><small>Forma prevista</small>${ROT.forma[c.forma_prevista] || '—'}</div>
          <div style="grid-column:span 3"><small>Descrição</small>${esc(c.descricao)}</div>
          <div><small>Valor</small><b>${brl(c.valor)}</b></div><div><small>Pago</small>${brl(s.pago)}</div><div><small>Saldo</small><b>${brl(s.saldo)}</b></div>
          <div><small>Emissão</small>${fmtData(c.emissao)}</div><div><small>Vencimento</small>${fmtData(c.vencimento)}</div><div><small>Atraso</small>${s.diasAtraso ? `${s.diasAtraso} dia(s)` : '—'}</div>
          ${c.obs ? `<div style="grid-column:span 3"><small>Observações</small>${esc(c.obs)}</div>` : ''}</div>
        <h2 style="font-size:14px">Pagamentos</h2>${tabela(['Data', 'Forma', { t: 'Valor', c: 'num' }, 'Registrado por', 'Obs.'], pgs.map(p => `<tr><td>${fmtData(p.data)}</td><td>${ROT.forma[p.forma]}</td><td class="num">${brl(p.valor)}</td><td>${esc(nomeUsu(p.por))}</td><td>${esc(p.obs)}</td></tr>`), 'Nenhum pagamento registrado.')}`,
      rodape: `<div class="esq">${!c.cancelada && s.pago === 0 ? `<button class="btn perigo" data-act="cb-cancelar" data-id="${c.id}">Cancelar cobrança</button>` : ''}</div><button class="btn sec" data-act="fechar">Fechar</button>${!c.cancelada && s.saldo > 0 ? `<button class="btn" data-act="pg-novo" data-id="${c.id}">Dar baixa</button>` : ''}`,
    };
  },
  'pg-form'(m) {
    const c = cobranca(m.d.id), s = situacaoCobranca(c), os = osDaCobranca(c);
    const tipoPg = val(m, 'tipo_pg', 'total');
    const saldoTxt = String(s.saldo.toFixed(2)).replace('.', ',');
    return {
      t: 'Dar baixa', form: 'pg-form', cls: 'estreita',
      corpo: `<div class="aviso" style="margin-bottom:14px"><b>${os ? os.numero : c.numero}</b> · ${esc(nomeCli(c.cliente_id))}<br>${esc(c.descricao)}<br>Valor ${brl(c.valor)}${s.pago ? ` · já pago ${brl(s.pago)}` : ''} · <b>em aberto ${brl(s.saldo)}</b></div>
        <div class="form">${campo('Foi pago?', `<div class="opcoes"><label><input type="radio" name="tipo_pg" value="total" data-refresh ${tipoPg === 'total' ? 'checked' : ''}>Pago (total)</label><label><input type="radio" name="tipo_pg" value="parcial" data-refresh ${tipoPg === 'parcial' ? 'checked' : ''}>Pago parcial</label></div>`, 's6')}
