function modalHTML() {
  const m = UI.modal; if (!m) return '';
  const r = MODAIS[m.tipo](m);
  const inner = `<div class="corpo">${m.erro ? `<div class="aviso erro" style="margin-bottom:14px">${esc(m.erro)}</div>` : ''}${r.corpo}</div><footer>${r.rodape}</footer>`;
  return `<div class="fundo-modal"><div class="modal ${r.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(r.t)}"><header><h2>${esc(r.t)}</h2><button type="button" class="icone-btn" data-act="fechar" aria-label="Fechar">${ic('fechar')}</button></header>
    ${r.form ? `<form data-form="${r.form}" novalidate>${inner}</form>` : inner}</div></div>`;
}

// ---------------------------------------------------------------- envio dos formulários
function lerForm(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name || el.disabled && el.type !== 'hidden') continue;
    if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type !== 'file') o[el.name] = el.value;
  }
  return o;
}
// Ajustes automáticos quando um campo muda (sem perder o que já foi digitado).
function aoAtualizarCampo(m, nome) {
  const v = m.v;
  if (m.tipo === 'os-form') {
    if (nome === 'cliente_id' || nome === 'tipo') {
      const c = cliente(v.cliente_id);
      if (nome === 'cliente_id') v.locacao_id = '';
      if (c && (nome === 'cliente_id' || !v.endereco)) { v.endereco = `${c.endereco} — ${c.bairro}`; v.lat = c.lat; v.lng = c.lng; }
    }
    if (nome === 'locacao_id') { const l = locacao(v.locacao_id); if (l) v.capacidade = String(l.capacidade); }
    if (nome === 'data') { v.vencimento = v.data; v.prev_retirada = addDias(v.data, 7); }
  }
}

const FORMS = {
  login(v) {
    if (SB_ATIVO) return loginSupabase(v.login, v.senha);
    const u = S.perfis.find(x => x.login.toLowerCase() === v.login.trim().toLowerCase());
    if (!u || u.senha !== v.senha) return renderLogin('Usuário ou senha inválidos.', v.login);
    if (!u.ativo) return renderLogin('Este usuário está desativado. Procure o administrador.', v.login);
    entrar(u);
  },
  'cli-form'(v, m) {
    const tipo = v.tipo, doc = so(v.doc), tel = so(v.telefone), wpp = so(v.whatsapp);
    if (!v.nome.trim()) throw erro(tipo === 'PJ' ? 'Informe a razão social.' : 'Informe o nome.');
    if (tipo === 'PF' ? !cpfValido(doc) : !cnpjValido(doc)) throw erro(`${tipo === 'PF' ? 'CPF' : 'CNPJ'} inválido. Confira os números.`);
    if (S.clientes.some(c => c.doc === doc && c.id !== m.d.id)) throw erro('Já existe um cliente com este CPF/CNPJ.');
    if (!/^\d{10,11}$/.test(tel)) throw erro('Telefone inválido: informe DDD + número.');
    if (wpp && !/^\d{10,11}$/.test(wpp)) throw erro('WhatsApp inválido: informe DDD + número.');
    if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) throw erro('E-mail inválido.');
    if (!v.endereco.trim() || !v.bairro.trim()) throw erro('Informe endereço e bairro.');
    if (v.lat === '' || v.lng === '') throw erro('Marque a localização do cliente no mapa.');
    const dados = { tipo, nome: v.nome.trim(), doc, telefone: tel, whatsapp: wpp, email: v.email.trim(), endereco: v.endereco.trim(), bairro: v.bairro.trim(), cidade: v.cidade.trim() || 'Parauapebas/PA', cep: v.cep.trim(), lat: Number(v.lat), lng: Number(v.lng), obs: v.obs.trim() };
    let c;
    if (m.d.id) { c = cliente(m.d.id); Object.assign(c, dados); auditar('cliente.editar', `Cliente ${c.nome} alterado`, UI.user.id); }
    else { c = { id: uid(), ...dados, ativo: true, criado_em: hojeISO() }; S.clientes.push(c); auditar('cliente.criar', `Cliente ${c.nome} cadastrado`, UI.user.id); }
    salvar();
    if (m.d.voltarOS) { const vo = m.d.voltarOS; vo.cliente_id = c.id; vo.endereco = `${c.endereco} — ${c.bairro}`; vo.lat = c.lat; vo.lng = c.lng; abrir('os-form', {}, vo); }
    else abrir('cli-ver', { id: c.id });
    toast(`Cliente ${c.nome} salvo.`, 'ok');
  },
  'cac-form'(v) {
    const n = v.numero.trim().toUpperCase();
    if (!n) throw erro('Informe o número.');
    if (S.cacambas.some(c => c.numero.toUpperCase() === n)) throw erro(`Já existe a caçamba ${n}.`);
    S.cacambas.push({ id: uid(), numero: n, capacidade: Number(v.capacidade), status: 'disponivel', obs: v.obs.trim() });
    auditar('cacamba.criar', `Caçamba ${n} (${fmtM3(v.capacidade)}) cadastrada`, UI.user.id);
    salvar(); fecharModal(); toast(`Caçamba ${n} cadastrada.`, 'ok');
  },
  'cac-status'(v, m) {
    const c = cacamba(m.d.id);
    if (c.status === 'em_operacao') throw erro('Caçamba em operação: o status muda pela O.S. de retirada.');
    c.status = v.status; c.obs = v.obs.trim();
    auditar('cacamba.status', `Caçamba ${c.numero}: ${ROT.statusCac[c.status]}`, UI.user.id);
    salvar(); fecharModal(); toast('Status atualizado.', 'ok');
  },
  'os-form'(v, m) {
    const os = criarOS({
      tipo: v.tipo, cliente_id: v.cliente_id, modalidade: v.modalidade, locacao_id: v.locacao_id, capacidade: v.capacidade,
      endereco: (v.endereco || '').trim(), lat: v.lat === '' || v.lat == null ? null : Number(v.lat), lng: v.lng === '' || v.lng == null ? null : Number(v.lng),
      motorista_id: v.motorista_id, agendada_para: v.data && v.hora ? `${v.data}T${v.hora}` : '', prev_retirada: v.prev_retirada, valor: v.valor, vencimento: v.vencimento,
      obs: (v.obs || '').trim(), foto_local: m.v.foto_local || null,
    }, UI.user.id);
    salvar(); UI.destaque[os.id] = Date.now(); fecharModal(); toast(`${os.numero} criada, lançada no financeiro e enviada para ${nomeUsu(os.motorista_id)}.`, 'ok');
  },
  'os-editar'(v, m) {
    const o = ordem(m.d.id);
    if (o.status !== 'aguardando') throw erro('Só é possível editar O.S. aguardando execução.');
    if (!v.data || !v.hora) throw erro('Informe data e horário.');
    const mudou = o.motorista_id !== v.motorista_id;
    Object.assign(o, { motorista_id: v.motorista_id, agendada_para: `${v.data}T${v.hora}`, obs: v.obs.trim() });
    auditar('os.editar', `${o.numero} alterada${mudou ? `; reatribuída a ${nomeUsu(o.motorista_id)}` : ''}`, UI.user.id);
    salvar(); UI.destaque[o.id] = Date.now(); abrir('os-ver', { id: o.id }); toast('O.S. atualizada.', 'ok');
  },
  'os-cancelar'(v, m) { const o = ordem(m.d.id); cancelarOS(o, v.motivo, UI.user.id); salvar(); UI.destaque[o.id] = Date.now(); abrir('os-ver', { id: o.id }); toast(`${o.numero} cancelada.`); },
  'os-excecao'(v, m) { const o = ordem(m.d.id); autorizarExcecao(o, v.motivo, UI.user.id); salvar(); abrir('os-ver', { id: o.id }); toast('Exceção registrada. O motorista já pode concluir sem fotos.', 'ok'); },
  'mens-gerar'(v) { const r = gerarMensalidades(v.mes, UI.user.id); salvar(); fecharModal(); toast(`${r.geradas} mensalidade(s) gerada(s) para ${fmtComp(v.mes)}.`, 'ok'); },
  'pg-form'(v, m) {
    const c = cobranca(m.d.id);
    registrarPagamento(c.id, { valor: num(v.valor), data: v.data, forma: v.forma, obs: v.obs.trim() }, UI.user.id);
    salvar(); fecharModal(); toast(`Baixa registrada: ${ROT.situacao[situacaoCobranca(c).sit].toLowerCase()}.`, 'ok');
  },
  'cb-form'(v) {
    if (!cliente(v.cliente_id)) throw erro('Selecione o cliente.');
    if (!v.descricao.trim()) throw erro('Informe a descrição.');
    const valor = num(v.valor); if (!(valor > 0)) throw erro('Informe um valor maior que zero.');
    if (!v.vencimento) throw erro('Informe o vencimento.');
    const c = criarCobranca({ cliente_id: v.cliente_id, descricao: v.descricao.trim(), valor, vencimento: v.vencimento, forma_prevista: v.forma_prevista, obs: v.obs.trim() }, UI.user.id);
    salvar(); abrir('cb-ver', { id: c.id }); toast(`Cobrança ${c.numero} criada.`, 'ok');
  },
  'usu-supabase'(v) {
    const sql = sqlNovoPerfil(v.nome, v.login, v.papel);
    if (!v.nome.trim() || !v.login.trim()) throw erro('Preencha nome e usuário.');
    try { navigator.clipboard.writeText(sql).then(() => toast('SQL copiado. Cole no SQL Editor do Supabase.', 'ok'), () => toast('Selecione o texto e copie com Ctrl+C.')); } catch (e) { toast('Selecione o texto e copie com Ctrl+C.'); }
  },
  'usu-form'(v, m) {
    const u = m.d.id ? usuario(m.d.id) : null;
    if (!v.nome.trim()) throw erro('Informe o nome.');
    if (!u) {
      if (!/^[a-z0-9._-]{3,}$/i.test(v.login || '')) throw erro('Usuário deve ter ao menos 3 letras/números, sem espaços.');
      if (S.perfis.some(x => x.login.toLowerCase() === v.login.toLowerCase())) throw erro('Este usuário já existe.');
    }
    if ((!u || v.senha) && (v.senha || '').length < 6) throw erro('A senha deve ter ao menos 6 caracteres.');
    const tel = so(v.telefone);
    if (u) {
      Object.assign(u, { nome: v.nome.trim(), telefone: tel }); if (v.papel && u.id !== UI.user.id) u.papel = v.papel; if (v.senha) u.senha = v.senha;
      auditar('usuario.editar', `Usuário ${u.login} alterado${v.senha ? ' (senha redefinida)' : ''}`, UI.user.id);
    } else {
      S.perfis.push({ id: uid(), nome: v.nome.trim(), login: v.login.trim().toLowerCase(), senha: v.senha, papel: v.papel, telefone: tel, ativo: true });
      auditar('usuario.criar', `Usuário ${v.login} (${ROT.papel[v.papel]}) criado`, UI.user.id);
    }
    salvar(); fecharModal(); toast('Usuário salvo.', 'ok');
  },
};

/* =====================================================================
   App do motorista
   Sem internet, o que o motorista faz fica guardado no celular (fila) e é
   enviado ao banco quando a conexão volta.
   ===================================================================== */
let DRV = null;
function resetDRV(motId) { DRV = { mot: motId, tela: 'lista', aba: 'abertas', osId: null, avisos: [], rasc: {}, erro: '' }; }

const motOS = () => S.os.filter(o => o.motorista_id === DRV.mot);
const motOrdem = id => motOS().find(o => o.id === id);
const motCliente = id => cliente(id) || { nome: '—', telefone: '', whatsapp: '' };
const motCacamba = id => id ? cacamba(id) : null;
const motDisponiveis = cap => S.cacambas.filter(c => c.status === 'disponivel' && c.capacidade === cap);
const pendenteEnvio = id => typeof FILA !== 'undefined' && FILA.some(tx => tx.linhas.some(l => l.t === 'os' && l.id === id));
function quando(s) {
  const d = s.slice(0, 10), h = hojeISO();
  const rot = d === h ? 'Hoje' : d === addDias(h, 1) ? 'Amanhã' : d === addDias(h, -1) ? 'Ontem' : fmtData(d);
  return `${rot} · ${fmtHora(s)}`;
}
function cacMot(o) {
  const r = motCacamba(o.cacamba_retirada_id), e = motCacamba(o.cacamba_entregue_id);
  if (o.tipo === 'entrega') return `Entregar ${e ? e.numero : 'caçamba'} (${fmtM3(o.capacidade)})`;
  if (o.tipo === 'retirada') return `Retirar ${r ? r.numero : ''} (${fmtM3(o.capacidade)})`;
  return `Retirar ${r ? r.numero : ''} → entregar ${e ? e.numero : 'outra'} (${fmtM3(o.capacidade)})`;
}

function appMotorista(motId, modo) {
  if (!DRV || DRV.mot !== motId) resetDRV(motId);
  const u = usuario(motId) || { nome: 'Motorista' };
  const st = (typeof textoStatusSync === 'function' && textoStatusSync()) || { cls: navigator.onLine ? 'ok' : 'off', txt: navigator.onLine ? 'Conectado' : 'Sem internet' };
  const barra = `<div class="m-barra"><div class="t"><small>App do motorista</small><b>Olá, ${esc(u.nome.split(' ')[0])}</b></div>${modo === 'full' ? `<button data-act="sair" aria-label="Sair">${ic('sair')}</button>` : ''}</div>
    <div class="m-rede ${st.cls === 'off' ? 'off' : ''}">${ic(st.cls === 'off' ? 'offline' : 'online')}<span id="m-rede-txt">${esc(st.txt)}</span></div>`;
  const avisos = DRV.avisos.map((a, i) => `<div class="m-aviso aviso ${a.tipo}" >${esc(a.msg)} <button class="lnk" data-act="mot-aviso-fechar" data-i="${i}">ok</button></div>`).join('');
  let corpo = '', rodape = '';
  if (DRV.tela === 'lista') [corpo, rodape] = motLista();
  else if (DRV.tela === 'os') [corpo, rodape] = motDetalhe();
  else [corpo, rodape] = motConcluir();
  return `<div class="celular">${barra}${DRV.tela === 'lista' ? `<div class="m-abas"><button class="${DRV.aba === 'abertas' ? 'ativo' : ''}" data-act="mot-aba" data-aba="abertas">Minhas O.S.</button><button class="${DRV.aba === 'historico' ? 'ativo' : ''}" data-act="mot-aba" data-aba="historico">Histórico</button></div>` : ''}
    <div class="m-corpo">${avisos}${corpo}</div>${rodape ? `<div class="m-rodape">${rodape}</div>` : ''}</div>`;
}

function motLista() {
  const lista = motOS();
  const ab = DRV.aba === 'abertas';
  const l = lista.filter(o => ab ? ['aguardando', 'em_andamento'].includes(o.status) : ['concluida', 'cancelada'].includes(o.status))
    .sort((a, b) => ab ? a.agendada_para.localeCompare(b.agendada_para) : (b.concluida_em || b.agendada_para).localeCompare(a.concluida_em || a.agendada_para));
  if (!l.length) return [`<div class="m-vazio">${ic('check')}<p>${ab ? 'Nenhuma O.S. pendente. Bom trabalho!' : 'Nenhuma O.S. no histórico.'}</p></div>`, ''];
  const resumo = ab ? `<p class="sub" style="margin:2px 2px 10px">${l.filter(o => o.status === 'aguardando').length} aguardando · ${l.filter(o => o.status === 'em_andamento').length} em andamento</p>` : `<p class="sub" style="margin:2px 2px 10px">${l.filter(o => o.status === 'concluida').length} concluída(s)</p>`;
  return [resumo + l.map(o => { const c = motCliente(o.cliente_id); return `<button class="m-card" data-act="mot-abrir" data-id="${o.id}">
    <div class="l1"><b>${o.numero}</b>${selo('statusOS', o.status)}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="tag">${ROT.tipoOS[o.tipo]}</span><span class="sub">${quando(o.concluida_em && !ab ? o.concluida_em : o.agendada_para)}</span></div>
    <div><b style="font-weight:600">${esc(c.nome)}</b></div><div class="end">${esc(o.endereco)}</div><div class="sub" style="margin-top:4px">${cacMot(o)}</div>
    ${pendenteEnvio(o.id) ? '<div class="pend">Salvo no celular · aguardando envio</div>' : ''}</button>`; }).join(''), ''];
}

function motDetalhe() {
  const o = motOrdem(DRV.osId);
  if (!o) { DRV.tela = 'lista'; return motLista(); }
  const c = motCliente(o.cliente_id);
  const exig = Object.entries(fotosExigidas(o)).map(([t, n]) => `${n} foto(s): ${ROT.fotoTipo[t].toLowerCase()}`).join(' · ');
  let rodape = '';
  if (o.status === 'aguardando') rodape = `<button class="btn cheio" data-act="mot-iniciar">${ic('caminhao')}Iniciar serviço</button>`;
  else if (o.status === 'em_andamento') rodape = `<button class="btn cheio ok" data-act="mot-concluir">${ic('camera')}Concluir serviço</button>`;
  return [`<button class="m-voltar" data-act="mot-voltar">${ic('voltar')}Voltar</button>
    <div class="m-sec"><div class="l1" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:16px">${o.numero}</b>${selo('statusOS', o.status)}</div>
      <div class="m-dado"><span>Serviço</span><b>${ROT.tipoOS[o.tipo]}</b></div><div class="m-dado"><span>Agendado</span><b>${quando(o.agendada_para)}</b></div>
      <div class="m-dado"><span>Caçamba</span><b>${cacMot(o)}</b></div>${o.status === 'concluida' ? `<div class="m-dado"><span>Concluída</span><b>${fmtDataHora(o.concluida_em)}</b></div>` : `<div class="m-dado"><span>Comprovação</span><b>${o.excecao ? 'dispensada pelo escritório' : exig}</b></div>`}</div>
    ${o.excecao && o.status !== 'concluida' ? `<div class="m-aviso aviso alerta">O escritório autorizou concluir sem fotos: ${esc(o.excecao.motivo)}</div>` : ''}
    <div class="m-sec"><h3>Cliente e local</h3><div style="font-weight:600">${esc(c.nome)}</div><div class="sub">Tel. ${fmtFone(c.telefone)}${c.whatsapp && c.whatsapp !== c.telefone ? ` · WhatsApp ${fmtFone(c.whatsapp)}` : ''}</div>
      <div style="margin:8px 0">${esc(o.endereco)}</div>
      ${mapaSVG({ pontos: [{ id: o.id, lat: o.lat, lng: o.lng, rotulo: '', cor: '#e8862e', titulo: o.endereco }], altura: 200 })}
      <p style="margin:8px 0 0"><a href="https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}" target="_blank" rel="noopener">Abrir rota no GPS do celular</a></p></div>
    ${o.obs ? `<div class="m-sec"><h3>Observações do escritório</h3>${esc(o.obs)}</div>` : ''}
    ${o.foto_local ? `<div class="m-sec"><h3>Foto do local</h3>${galeria([fotoLocal(o)])}</div>` : ''}
    ${o.status === 'concluida' ? `<div class="m-sec"><h3>Fotos enviadas</h3>${galeria(o.fotos)}${o.obs_motorista ? `<p class="sub">Obs.: ${esc(o.obs_motorista)}</p>` : ''}</div>` : ''}
    ${o.status === 'cancelada' ? `<div class="m-aviso aviso erro">O.S. cancelada pelo escritório${o.cancelamento ? `: ${esc(o.cancelamento.motivo)}` : ''}.</div>` : ''}`, rodape];
}

function rascunho(o) {
  if (!DRV.rasc[o.id]) DRV.rasc[o.id] = { fotos: { entrega: [], retirada: [] }, cac: o.cacamba_entregue_id || '', gps: null, obs: '' };
  return DRV.rasc[o.id];
}
function motConcluir() {
  const o = motOrdem(DRV.osId);
  if (!o || o.status !== 'em_andamento') { DRV.tela = 'os'; return motDetalhe(); }
  const r = rascunho(o), exig = fotosExigidas(o);
  const grupo = (tipo, n) => {
    const titulo = tipo === 'retirada' ? `Caçamba retirada${motCacamba(o.cacamba_retirada_id) ? ` (${motCacamba(o.cacamba_retirada_id).numero})` : ''}` : 'Caçamba posicionada';
    const slots = Array.from({ length: n }, (_, i) => {
      const f = r.fotos[tipo][i];
      return f ? `<div class="slot"><img src="${f.src}" alt="Foto ${i + 1}"><span class="kb">${f.kbOriginal} KB → ${f.kb} KB</span><button class="tirar" data-act="mot-tirar-foto" data-tipo="${tipo}" data-i="${i}" aria-label="Remover foto">×</button></div>`
        : `<label class="slot">${ic('camera')}<span>Foto ${i + 1}</span><input type="file" accept="image/*" capture="environment" data-mot-foto="${tipo}" data-i="${i}"></label>`;
    }).join('');
    return `<div class="m-sec"><h3>${titulo} · ${r.fotos[tipo].filter(Boolean).length}/${n} fotos${o.excecao ? ' (opcional)' : ''}</h3><div class="slots">${slots}</div></div>`;
  };
  const precisaCac = o.tipo !== 'retirada';
  const disp = precisaCac ? motDisponiveis(o.capacidade) : [];
  const cacFixa = o.cacamba_entregue_id ? motCacamba(o.cacamba_entregue_id) : null;
  const corpo = `<button class="m-voltar" data-act="mot-voltar">${ic('voltar')}Voltar</button>
    <div class="m-sec"><b>${o.numero} · ${ROT.tipoOS[o.tipo]}</b><div class="sub">${esc(motCliente(o.cliente_id).nome)} · ${esc(o.endereco)}</div></div>
    ${DRV.erro ? `<div class="m-aviso aviso erro">${esc(DRV.erro)}</div>` : ''}
    ${o.excecao ? `<div class="m-aviso aviso alerta">Fotos dispensadas pelo escritório: ${esc(o.excecao.motivo)}</div>` : ''}
    ${exig.retirada ? grupo('retirada', exig.retirada) : ''}${exig.entrega ? grupo('entrega', exig.entrega) : ''}
    ${precisaCac ? `<div class="m-sec"><h3>Número da caçamba entregue</h3>${cacFixa ? `<div class="m-dado"><span>Definida pelo escritório</span><b>${cacFixa.numero} (${fmtM3(cacFixa.capacidade)})</b></div>` : `<select data-mot-cac><option value="">Selecione a caçamba…</option>${disp.map(c => opt(c.id, `${c.numero} (${fmtM3(c.capacidade)})`, r.cac)).join('')}</select><p class="sub" style="margin:6px 0 0">${disp.length} disponível(is) de ${fmtM3(o.capacidade)} no pátio.</p>`}</div>` : ''}
    <div class="m-sec"><h3>Localização</h3>${r.gps ? `<div class="m-dado"><span>GPS</span><b class="mono">${r.gps.lat.toFixed(5)}, ${r.gps.lng.toFixed(5)}</b></div><div class="m-dado"><span>Precisão</span><b>±${r.gps.precisao} m · ${fmtHora(r.gps.em)}</b></div>` : '<p class="sub" style="margin:0 0 8px">Registre no local do serviço.</p>'}
      <button class="btn sec cheio" data-act="mot-gps">${ic('gps')}${r.gps ? 'Registrar de novo' : 'Registrar localização'}</button></div>
    <div class="m-sec"><h3>Observações (opcional)</h3><textarea data-mot-obs placeholder="Ex.: cliente pediu para afastar do muro">${esc(r.obs)}</textarea>
      <p class="sub" style="margin:6px 0 0">Data e hora da conclusão são registradas ao finalizar.</p></div>`;
  return [corpo, `<button class="btn cheio ok" data-act="mot-finalizar">${ic('check')}Finalizar O.S.</button>`];
}

// ---------------------------------------------------------------- ações do motorista
const ACTS_MOT = {
  'mot-aba'(el) { DRV.aba = el.dataset.aba; render(); },
  'mot-abrir'(el) { DRV.osId = el.dataset.id; DRV.tela = 'os'; DRV.erro = ''; render(); },
  'mot-voltar'() { DRV.erro = ''; DRV.tela = DRV.tela === 'concluir' ? 'os' : 'lista'; render(); },
  'mot-aviso-fechar'(el) { DRV.avisos.splice(Number(el.dataset.i), 1); render(); },
  'mot-iniciar'() {
    const o = ordem(DRV.osId);
    try { iniciarOS(o, agoraISO(), DRV.mot); }
    catch (e) { DRV.avisos.push({ tipo: 'erro', msg: e.message }); render(); return; }
    salvar(); UI.destaque[o.id] = Date.now(); DRV.tela = 'os'; render();
    toast(navigator.onLine ? `${o.numero} em andamento.` : 'Início salvo no celular; será enviado quando houver internet.', 'ok');
  },
  'mot-concluir'() { DRV.tela = 'concluir'; DRV.erro = ''; render(); },
  'mot-gps'() {
    const o = motOrdem(DRV.osId), r = rascunho(o);
    const simulado = () => { r.gps = { lat: o.lat + (Math.random() - .5) * 0.0005, lng: o.lng + (Math.random() - .5) * 0.0005, precisao: 4 + Math.round(Math.random() * 10), em: agoraISO(), simulado: true }; render(); };
    if (!navigator.geolocation) return simulado();
    toast('Obtendo localização…');
    navigator.geolocation.getCurrentPosition(
      p => { r.gps = { lat: p.coords.latitude, lng: p.coords.longitude, precisao: Math.round(p.coords.accuracy), em: agoraISO() }; render(); },
      () => { simulado(); toast('GPS indisponível neste aparelho; usada a posição do endereço da O.S.'); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
  },
  'mot-tirar-foto'(el) { const r = rascunho(motOrdem(DRV.osId)); r.fotos[el.dataset.tipo].splice(Number(el.dataset.i), 1); render(); },
  'mot-finalizar'() {
    const o = motOrdem(DRV.osId), r = rascunho(o), exig = fotosExigidas(o);
    DRV.erro = '';
    if (!o.excecao) for (const [t, n] of Object.entries(exig)) if (r.fotos[t].filter(Boolean).length < n) { DRV.erro = `Envie as ${n} fotos de "${ROT.fotoTipo[t].toLowerCase()}".`; break; }
    if (!DRV.erro && o.tipo !== 'retirada' && !(o.cacamba_entregue_id || r.cac)) DRV.erro = 'Selecione o número da caçamba entregue.';
    if (!DRV.erro && !r.gps) DRV.erro = 'Registre a localização antes de finalizar.';
    if (DRV.erro) { render(); document.querySelector('.m-corpo')?.scrollTo(0, 0); return; }
    const fotos = [...r.fotos.retirada, ...r.fotos.entrega].filter(Boolean).map(f => ({ id: f.id, tipo: f.tipo, src: f.src, kb: f.kb, em: agoraISO() }));
    const payload = { cacamba_id: o.cacamba_entregue_id || r.cac, fotos, gps: { lat: r.gps.lat, lng: r.gps.lng, precisao: r.gps.precisao }, obs: r.obs.trim(), em: agoraISO() };
    try { concluirOS(o, payload, DRV.mot); }
    catch (e) { DRV.erro = e.message; render(); return; }
    salvar(); UI.destaque[o.id] = Date.now();
    if (semArmazenamento) toast('O celular está sem espaço para guardar as fotos; conecte-se à internet para enviá-las.', 'erro');
    delete DRV.rasc[o.id]; DRV.tela = 'lista'; DRV.aba = 'abertas'; render();
    toast(navigator.onLine ? `${o.numero} concluída e enviada.` : `${o.numero} salva no celular; será enviada quando houver internet.`, 'ok');
  },
};

/* =====================================================================
   Renderização e eventos
   ===================================================================== */
const $app = () => document.getElementById('app');
let confirmarSaida = false;
let confirmarCB = null;

function render() {
  const f = document.querySelector('#modal-root form');
  if (f && UI.modal) UI.modal.v = { ...UI.modal.v, ...lerForm(f) };
  const a = document.activeElement, focoId = a && a.id, sel = a && typeof a.selectionStart === 'number' ? a.selectionStart : null;
  const rolagem = document.querySelector('.m-corpo')?.scrollTop;
  if (!UI.user) $app().innerHTML = telaLogin();
  else if (UI.user.papel === 'motorista') $app().innerHTML = `<div class="mot-full">${appMotorista(UI.user.id, 'full')}</div>`;
  else $app().innerHTML = layoutPainel();
  renderModal();
  montarMapas($app());
  if (focoId) { const el = document.getElementById(focoId); if (el) { el.focus(); if (sel != null) try { el.setSelectionRange(sel, sel); } catch (e) { } } }
  const mc = document.querySelector('.m-corpo'); if (mc && rolagem && DRV && DRV.tela !== 'lista') mc.scrollTop = rolagem;
}
function renderLogin(msg, login) { $app().innerHTML = telaLogin(msg, login); }
function renderModal() { document.getElementById('modal-root').innerHTML = modalHTML(); montarMapas(document.getElementById('modal-root')); }
function abrir(tipo, d = {}, v = {}) { UI.modal = { tipo, d, v, erro: '' }; renderModal(); document.querySelector('.fundo-modal')?.scrollTo(0, 0); }
function fecharModal() { if (UI.modal && UI.modal.voltar) { const v = UI.modal.voltar; UI.modal = v; renderModal(); return; } UI.modal = null; render(); }
function toast(msg, tipo = '') {
  const el = document.createElement('div'); el.className = `toast ${tipo}`; el.textContent = msg;
  document.getElementById('toast-root').appendChild(el); setTimeout(() => el.remove(), 4000);
}
function confirmar(titulo, texto, botao, cb, perigo) { confirmarCB = cb; abrir('confirmar', { titulo, texto, botao, perigo }); }
function entrar(u) {
  UI.user = u; UI.view = 'dashboard'; UI.modal = null; UI.sim = false;
  if (u.papel === 'motorista') resetDRV(u.id);
  if (!SB_ATIVO) try { sessionStorage.setItem('locacambas-sessao', u.id); } catch (e) { }
  render(); window.scrollTo(0, 0);
}
function setCaminho(caminho, valor) { const p = caminho.split('.'); let o = UI; while (p.length > 1) o = o[p.shift()]; o[p[0]] = valor; }

function acharFoto(id) {
  for (const o of S.os) {
    if ('local-' + o.id === id) return { src: fotoSrc(fotoLocal(o)), titulo: `${o.numero} · foto inicial do local` };
    const f = o.fotos.find(x => x.id === id); if (f) return { src: fotoSrc(f), titulo: `${o.numero} · ${ROT.fotoTipo[f.tipo]}`, info: f.kb ? `${f.kb} KB após compressão${f.em ? ` · ${fmtDataHora(f.em)}` : ''}` : '' };
  }
  return null;
}

// ---------------------------------------------------------------- ações (cliques)
const ACTS = {
  ir(el) { UI.view = el.dataset.v; UI.menuAberto = false; render(); window.scrollTo(0, 0); },
  menu() { UI.menuAberto = !UI.menuAberto; render(); },
  sair() {
    if (SB_ATIVO && FILA.length && !confirmarSaida) { confirmarSaida = true; toast(`Há ${FILA.length} alteração(ões) ainda não enviadas. Conecte-se à internet antes de sair, ou toque em Sair de novo para sair assim mesmo.`, 'erro'); return; }
    confirmarSaida = false; UI.user = null; UI.sim = false; UI.modal = null; DRV = null; try { sessionStorage.removeItem('locacambas-sessao'); } catch (e) { } if (SB_ATIVO) sairSupabase(); render();
  },
  restaurar() { confirmar('Zerar todos os dados', 'Todos os clientes, caçambas, O.S., cobranças e pagamentos deste navegador serão apagados. Os usuários continuam. Continuar?', 'Zerar', () => { if (SB_ATIVO) { zerarBanco().then(() => { DRV = null; render(); toast('Dados zerados.', 'ok'); }).catch(e => toast(`Não foi possível zerar: ${e.message}`, 'erro')); return; } criarDadosExemplo(); DRV = null; UI.modal = null; UI.user = usuario(UI.user.id) || usuario('u-erikson'); render(); toast('Dados zerados.', 'ok'); }, true); },
  instalar() { instalarApp(); },
  'login-demo'(el) { entrar(usuario(el.dataset.id)); },
  sim() { UI.sim = !UI.sim; if (UI.sim && (!DRV || DRV.mot !== UI.simMot)) resetDRV(UI.simMot); render(); },
  fechar() { fecharModal(); },
  aba(el) { UI.modal.d.aba = el.dataset.aba; renderModal(); },
  'confirmar-sim'() { const cb = confirmarCB; confirmarCB = null; UI.modal = null; cb && cb(); render(); },
  'ver-foto'(el) { const f = acharFoto(el.dataset.id) || { src: el.getAttribute('src'), titulo: 'Foto' }; const anterior = UI.modal; abrir('foto', f); UI.modal.voltar = anterior; },

  'cli-novo'() { abrir('cli-form', {}, { tipo: 'PJ' }); },
  'cli-novo-os'(el) { const form = el.closest('form'); abrir('cli-form', { voltarOS: { ...UI.modal.v, ...lerForm(form) } }, { tipo: 'PJ' }); },
  'cli-ver'(el) { abrir('cli-ver', { id: el.dataset.id }); },
  'cli-editar'(el) { abrir('cli-form', { id: el.dataset.id }); },

  'cac-nova'() { abrir('cac-form'); },
  'cac-status'(el) { abrir('cac-status', { id: el.dataset.id }); },
  'cac-hist'(el) { abrir('cac-hist', { id: el.dataset.id }); },
  'mapa-sel'(el) { if (UI.view === 'mapa' && !UI.modal) { UI.mapaSel = UI.mapaSel === el.dataset.id ? null : el.dataset.id; render(); } },

  'os-nova'(el) {
    const m = { tipo: 'os-form', d: {}, v: { tipo: 'entrega' }, erro: '' };
    if (el.dataset.cli) { m.v.cliente_id = el.dataset.cli; aoAtualizarCampo(m, 'cliente_id'); }
    if (el.dataset.mensal) m.v.modalidade = 'mensal';
    UI.modal = m; renderModal();
  },
  'geo-buscar'(el) { buscarEndereco(el.closest('.campo') || document); },
  'os-ver'(el) { abrir('os-ver', { id: el.dataset.id }); },
  'os-editar'(el) { abrir('os-editar', { id: el.dataset.id }); },
  'os-cancelar'(el) { abrir('os-cancelar', { id: el.dataset.id }); },
  'os-excecao'(el) { abrir('os-excecao', { id: el.dataset.id }); },

  'mens-gerar'() { abrir('mens-gerar'); },

  'cb-ver'(el) { abrir('cb-ver', { id: el.dataset.id }); },
  'cb-nova'() { abrir('cb-form'); },
  'pg-novo'(el) { abrir('pg-form', { id: el.dataset.id }); },
  'cb-cancelar'(el) {
    const c = cobranca(el.dataset.id);
    confirmar(`Cancelar cobrança ${c.numero}`, `A cobrança de <b>${brl(c.valor)}</b> para ${esc(nomeCli(c.cliente_id))} será cancelada e deixará de contar como valor a receber.`, 'Cancelar cobrança', () => {
      c.cancelada = true; auditar('cobranca.cancelar', `Cobrança ${c.numero} cancelada`, UI.user.id); salvar(); toast('Cobrança cancelada.');
    }, true);
  },

  'usu-novo'() { abrir(SB_ATIVO ? 'usu-supabase' : 'usu-form'); },
  'usu-editar'(el) { abrir('usu-form', { id: el.dataset.id }); },
  'usu-ativo'(el) { const u = usuario(el.dataset.id); u.ativo = !u.ativo; auditar('usuario.ativo', `Usuário ${u.login} ${u.ativo ? 'ativado' : 'desativado'}`, UI.user.id); salvar(); render(); },

  'rel-copiar'() {
    const f = UI.f.rel, d = dadosRelatorio(f.tipo, f.de, f.ate);
    const tsv = [d.cab, ...d.linhas].map(l => l.map(v => String(v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
    const falhou = () => abrir('copiar', { texto: tsv });
    try { navigator.clipboard.writeText(tsv).then(() => toast(`${d.linhas.length} linha(s) copiada(s). Cole no Excel com Ctrl+V.`, 'ok'), falhou); } catch (e) { falhou(); }
  },
  ...ACTS_MOT,
};

document.addEventListener('click', e => {
  const svg = e.target.closest('svg[data-pick]');
  if (svg) { marcarNoMapa(svg, e); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { fn(el); } catch (err) { console.error(err); toast(err.message || 'Erro inesperado.', 'erro'); }
});

function marcarNoMapa(svg, e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const lng = MAPA.O + p.x / MAPA.W * (MAPA.L - MAPA.O), lat = MAPA.N - p.y / MAPA.H * (MAPA.N - MAPA.S);
  const form = svg.closest('form');
  if (form) { form.elements.lat.value = lat.toFixed(6); form.elements.lng.value = lng.toFixed(6); }
  if (UI.modal) { UI.modal.v.lat = lat.toFixed(6); UI.modal.v.lng = lng.toFixed(6); }
  const pin = svg.querySelector('#pin'); pin.style.display = 'block'; pin.setAttribute('transform', `translate(${p.x} ${p.y})`);
  const t = document.getElementById('pin-txt'); if (t) t.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const nome = form.dataset.form, v = lerForm(form);
  if (nome === 'login') return FORMS.login(v);
  try { FORMS[nome](v, UI.modal); }
  catch (err) {
    if (!err.regra) console.error(err);
    if (UI.modal) { UI.modal.v = { ...UI.modal.v, ...v }; UI.modal.erro = err.message; renderModal(); document.querySelector('.fundo-modal')?.scrollTo({ top: 0, behavior: 'smooth' }); }
    else toast(err.message, 'erro');
  }
});

let tmrBusca = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input) { setCaminho(el.dataset.input, el.value); clearTimeout(tmrBusca); tmrBusca = setTimeout(render, 220); return; }
  if (el.hasAttribute('data-sql')) { const v = lerForm(el.form); document.getElementById('usu-email').textContent = emailDoLogin(v.login || 'usuario'); document.getElementById('usu-sql').value = sqlNovoPerfil(v.nome, v.login, v.papel); return; }
  if (el.hasAttribute('data-mot-obs')) { rascunho(motOrdem(DRV.osId)).obs = el.value; }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.change) {
    if (el.dataset.change === 'sim-mot') { UI.simMot = el.value; resetDRV(el.value); }
    else setCaminho(el.dataset.change, el.value);
    render(); return;
  }
  if (el.hasAttribute('data-sql')) { const v = lerForm(el.form); document.getElementById('usu-email').textContent = emailDoLogin(v.login || 'usuario'); document.getElementById('usu-sql').value = sqlNovoPerfil(v.nome, v.login, v.papel); return; }
  if (el.hasAttribute('data-refresh') && UI.modal) {
    UI.modal.v = { ...UI.modal.v, ...lerForm(el.form) }; aoAtualizarCampo(UI.modal, el.name); UI.modal.erro = ''; renderModal(); return;
  }
  if (el.hasAttribute('data-mot-cac')) { rascunho(motOrdem(DRV.osId)).cac = el.value; return; }
  if (el.dataset.file && el.files[0] && UI.modal) {
    try { const f = await comprimirImagem(el.files[0], 640); UI.modal.v = { ...UI.modal.v, ...lerForm(el.form), [el.dataset.file]: f.src }; renderModal(); toast(`Foto comprimida: ${f.kbOriginal} KB → ${f.kb} KB.`, 'ok'); }
    catch (err) { toast(err.message, 'erro'); }
    return;
  }
  if (el.dataset.motFoto && el.files[0]) {
    const tipo = el.dataset.motFoto, i = Number(el.dataset.i), osId = DRV.osId;
    try { const f = await comprimirImagem(el.files[0]); f.tipo = tipo; const r = rascunho(motOrdem(osId)); r.fotos[tipo][i] = f; DRV.erro = ''; render(); }
    catch (err) { toast(err.message, 'erro'); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('geo-q')) { e.preventDefault(); buscarEndereco(e.target.closest('.campo') || document); return; } if (e.key === 'Escape' && UI.modal && !UI.modal.tipo.endsWith('-form')) fecharModal(); });

// ---------------------------------------------------------------- início
(function iniciar() {
  if (SB_ATIVO) S = vazio();
  else {
    S = carregar();
    if (!S) criarDadosExemplo();
    const r = gerarMensalidades(mesAtual(), null, true);   // rotina diária automática
    if (r.geradas) { auditar('mensalidades.gerar', `Rotina automática: ${r.geradas} mensalidade(s) de ${fmtComp(mesAtual())}`, null); salvar(); }
  }
  if (SB_ATIVO) {
    $app().innerHTML = '<div class="login-tela"><p class="sub">Carregando…</p></div>';
    sessaoSupabase().then(ok => { if (!ok) render(); });
    return;
  }
  let sid = null; try { sid = sessionStorage.getItem('locacambas-sessao'); } catch (e) { }
  const u = sid && usuario(sid);
  if (u && u.ativo) entrar(u); else render();
})();

</script>
